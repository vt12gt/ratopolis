
<script id="ratopolis-v65-2-scenario-button-fix">
document.addEventListener('click', function(ev) {
  var btn = ev.target.closest && ev.target.closest('#newScenario');
  if (!btn) return;

  ev.preventDefault();
  ev.stopPropagation();
  ev.stopImmediatePropagation();

  try {
    if (typeof createScenario !== 'function') {
      alert('O editor visual não carregou corretamente.');
      return;
    }
    createScenario(null);
  } catch (err) {
    console.error('Erro ao abrir o editor:', err);
    alert('Erro ao abrir o editor: ' + err.message);
  }
}, true);
</script>
