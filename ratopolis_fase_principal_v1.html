<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#183b2b"><title>Ratópolis — Fase Principal (teste)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173b2b;font-family:system-ui,Arial,sans-serif;touch-action:none}#phase{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#70c7e9 0 32%,#83bd68 32% 58%,#caa25d 58%);color:#fff4d2}
.sky{position:absolute;inset:0 0 58%;background:linear-gradient(#5bb7e2,#c7e9d2)}.hills{position:absolute;inset:18% -5% 30%;background:radial-gradient(ellipse at 18% 68%,#438e4e 0 22%,transparent 23%),radial-gradient(ellipse at 78% 70%,#367c47 0 28%,transparent 29%),linear-gradient(165deg,transparent 0 35%,#79b85b 36%)}.ground{position:absolute;left:10%;right:8%;top:46%;bottom:-25%;border-radius:48% 48% 0 0;background:radial-gradient(ellipse,#e8c77b 0 48%,#d4aa60 76%);box-shadow:inset 0 10px 20px #98703b55}.path{position:absolute;left:40%;top:36%;width:20%;height:80%;transform:rotate(5deg);border-radius:50%;background:#d8b779}
.logo{position:absolute;z-index:4;top:2%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(17px,2.4vw,30px);font-weight:1000;letter-spacing:2px;color:#fff1b0;text-shadow:0 3px #75451f,0 5px 8px #0008;white-space:nowrap}.logo small{display:block;font-size:.42em;letter-spacing:4px}
.building{position:absolute;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:clamp(90px,13vw,180px);height:clamp(78px,15vh,145px);border:3px solid #754c2c;border-radius:18px 18px 10px 10px;background:linear-gradient(135deg,#f6d18a,#bd7544);box-shadow:0 9px 0 #75482b,0 14px 20px #163b2a88;color:#fff6d6;text-shadow:0 2px 3px #442b1b;cursor:pointer;touch-action:manipulation}.building span{font-size:clamp(32px,5vw,62px);filter:drop-shadow(0 3px 1px #50351d)}.building b{font-size:clamp(10px,1.2vw,16px);letter-spacing:1px}.building small{font-size:clamp(8px,.9vw,12px)}.building:active{transform:translateY(4px)}
.guild{left:8%;top:35%;background:linear-gradient(135deg,#a9c7a0,#527e56)}.campaign{left:31%;top:25%;background:linear-gradient(135deg,#e6bd76,#a74c3c)}.explore{right:8%;top:33%;background:linear-gradient(135deg,#9dcf85,#3f8050)}.ranking{right:27%;top:17%;background:linear-gradient(135deg,#f4d78b,#a77a35)}.shop{left:17%;top:61%;background:linear-gradient(135deg,#f4bd82,#a55d43)}.home{right:12%;top:62%;background:linear-gradient(135deg,#f5d49a,#a65d42)}.boss{left:44%;top:9%;width:clamp(75px,9vw,120px);height:clamp(65px,11vh,100px);background:linear-gradient(135deg,#8f91bc,#484b79)}.events{right:43%;top:60%;width:clamp(80px,10vw,135px);height:clamp(70px,12vh,110px);background:linear-gradient(135deg,#e9a2a7,#a74764)}
.tree{position:absolute;z-index:2;font-size:clamp(32px,5vw,65px);filter:drop-shadow(0 5px 2px #234)}.t1{left:2%;top:63%}.t2{right:2%;top:54%}.t3{left:5%;top:20%}.t4{right:4%;top:19%}
#rat{position:absolute;z-index:8;left:50%;top:78%;transform:translate(-50%,-50%);font-size:clamp(48px,6.5vw,76px);filter:drop-shadow(0 7px 4px #342);pointer-events:none;animation:ratIdle 1.8s ease-in-out infinite}@keyframes ratIdle{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -7px;rotate:2deg}}#rat:after{content:"";position:absolute;left:18%;right:18%;bottom:-4px;height:8px;border-radius:50%;background:#263b2477;filter:blur(3px)}
.hud{position:absolute;z-index:10;top:2%;left:2%;font-weight:900;text-shadow:0 2px 4px #234}.hint{position:absolute;z-index:10;right:2%;bottom:4%;max-width:38%;padding:8px 12px;border-radius:12px;background:#183b2dcc;font-size:clamp(9px,1vw,13px);text-align:center}
.modal{display:none;position:absolute;z-index:20;inset:0;background:#071b17aa;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.modal section{position:relative;width:min(420px,90%);padding:24px;border:3px solid #e4c36d;border-radius:20px;background:linear-gradient(145deg,#315c3f,#142d24);text-align:center;box-shadow:0 20px 60px #0009}.modal section>div{font-size:48px}.modal h2{margin:8px}.modal p{color:#e6e1c8}.modal button{border:0;border-radius:10px;padding:10px 16px;background:#d6a947;color:#2c2415;font-weight:900}.modal #close{position:absolute;right:12px;top:12px;background:#663d31;color:white}
@media(orientation:portrait) and (max-width:900px){#phase{inset:auto;top:0;left:100vw;left:100dvw;width:100vh;width:100dvh;height:100vw;height:100dvw;transform-origin:top left;transform:rotate(-90deg)}}
@media(orientation:landscape){#phase{inset:0;width:100vw;height:100dvh;transform:none}}

/* acabamento visual da praça */
#phase{background:linear-gradient(180deg,#79d2ed 0%,#b7e7d6 29%,#77b65e 30%,#498b48 54%,#d8b875 55%,#c79d58 100%)}
.sky:after{content:"☀";position:absolute;right:9%;top:8%;font-size:clamp(42px,7vw,86px);color:#fff1a2;text-shadow:0 0 28px #fff6;opacity:.9}
.ground{box-shadow:inset 0 12px 25px #fff3,inset 0 -18px 35px #80572b55,0 0 0 3px #8d693e44}
.building{border-width:4px;border-color:#74482c;box-shadow:inset 0 5px 0 #fff6,inset 0 -8px 0 #70432644,0 10px 0 #704326,0 17px 22px #163b2a66;background-image:linear-gradient(145deg,#fff5 0%,transparent 42%),linear-gradient(135deg,#f5d89c,#b87348)}
.building:before{content:"";position:absolute;left:12%;right:12%;top:-12px;height:16px;border-radius:12px 12px 3px 3px;background:#70452e;box-shadow:inset 0 4px #ffffff55}
.tree{animation:treeSway 4s ease-in-out infinite;transform-origin:bottom center}@keyframes treeSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.path{box-shadow:inset 0 0 24px #fff3}
.hint{border:1px solid #f6df9a;background:#214a35e8;box-shadow:0 4px 14px #193b2b55}
</style></head>
<body>
<main id="phase"><div class="sky"></div><div class="hills"></div><div class="ground"></div><div class="path"></div>
<div class="logo">🐭 RATÓPOLIS<small>FASE PRINCIPAL</small></div><div class="hud">🐾 Praça Principal</div>
<button class="building guild" data-place="Guilda"><span>🏰</span><b>GUILDA</b></button>
<button class="building campaign" data-place="Campanha"><span>🛡️</span><b>CAMPANHA</b><small>100 aventuras</small></button>
<button class="building explore" data-place="Exploração"><span>🌲</span><b>EXPLORAÇÃO</b><small>Mundo aberto</small></button>
<button class="building ranking" data-place="Ranking"><span>🏆</span><b>RANKING</b></button>
<button class="building shop" data-place="Loja"><span>🏪</span><b>LOJA</b></button>
<button class="building home" data-place="Meu Lar"><span>🏡</span><b>MEU LAR</b></button>
<button class="building boss" data-place="Boss"><span>🐉</span><b>BOSS</b></button>
<button class="building events" data-place="Eventos"><span>🎪</span><b>EVENTOS</b></button>
<div class="tree t1">🌳</div><div class="tree t2">🌲</div><div class="tree t3">🌳</div><div class="tree t4">🌲</div>
<div id="rat">🐭</div><div class="hint">Praça Principal · Toque em uma construção para entrar.</div>
<div class="modal" id="modal"><section><button id="close">✕</button><div id="ico">🏰</div><h2 id="title">Guilda</h2><p id="desc"></p><button id="enter">ENTRAR</button></section></div></main>
<script>
(()=>{const rat=document.getElementById('rat'),modal=document.getElementById('modal');const places={Guilda:['🏰','Guilda','Área social das guildas.'],Campanha:['🛡️','Campanha','Aqui serão apresentadas as 100 campanhas.'],Exploração:['🌲','Exploração','Entrada para o mundo aberto.'],Ranking:['🏆','Ranking','Classificação dos jogadores.'],Loja:['🏪','Loja','Itens e personalizações.'], 'Meu Lar':['🏡','Meu Lar','Sua casa particular.'],Boss:['🐉','Boss','Chefes e batalhas especiais.'],Eventos:['🎪','Eventos','Eventos e atividades temporárias.']};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});document.querySelectorAll('[data-place]').forEach(b=>b.addEventListener('click',()=>{let p=places[b.dataset.place];document.getElementById('ico').textContent=p[0];document.getElementById('title').textContent=p[1];document.getElementById('desc').textContent=p[2];modal.classList.add('open')}));document.getElementById('close').onclick=()=>modal.classList.remove('open');document.getElementById('enter').onclick=()=>modal.classList.remove('open');})();
</script></body></html>
