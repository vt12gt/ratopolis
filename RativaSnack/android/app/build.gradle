plugins { id 'com.android.application' }

android {
    namespace 'com.ratopolis.ratosnack'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ratopolis.ratosnack'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '38'
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
