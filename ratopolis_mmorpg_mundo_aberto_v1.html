<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17130f"><title>Ratópolis MMORPG — Mundo Aberto</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10170f;color:#fff0cc;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;transform-origin:top left}@media(orientation:portrait){#game{inset:auto;left:100vw;top:0;width:100dvh;height:100vw;transform:rotate(90deg)}}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.top{position:absolute;z-index:3;top:8px;left:9px;right:9px;display:flex;gap:8px;align-items:flex-start}.profile,.nav button,.right button,.panelbox{background:#201a16eF;border:1px solid #b99355;border-radius:11px;box-shadow:0 3px 12px #0008}.profile{padding:6px 9px;display:flex;gap:8px;align-items:center;min-width:145px}.avatar{font-size:28px}.name{font-size:12px;font-weight:900}.meta{font-size:10px;color:#e6c77f}.hp{height:6px;width:95px;background:#55201c;border-radius:8px;margin:3px 0}.hp i{display:block;width:100%;height:100%;background:#e54e40;border-radius:8px}.nav{display:flex;justify-content:center;gap:4px;flex:1;flex-wrap:wrap}.nav button,.right button{color:#fff0cc;padding:8px 10px;font-size:11px;font-weight:800}.nav button:active,.right button:active,.skill:active{transform:scale(.95)}.nav strong{color:#f2cf79}.right{display:flex;gap:4px}.quest{position:absolute;z-index:3;left:10px;top:91px;width:min(220px,30vw);padding:8px 10px;background:#211913dd;border-left:3px solid #e9c56e;border-radius:8px;font-size:11px}.quest b{color:#f2cf79}.loc{position:absolute;right:10px;top:58px;text-align:right;font-size:10px;text-shadow:0 2px 4px #000}.currency{position:absolute;top:58px;left:10px;font-size:11px;background:#17130fbb;padding:5px 8px;border-radius:8px}.joy{position:absolute;z-index:4;bottom:12px;left:12px;width:112px;height:112px;border-radius:50%;background:#16151288;border:1px solid #ffffff55;display:grid;place-items:center}.ring{width:72px;height:72px;border:2px solid #ffffff55;border-radius:50%;display:grid;place-items:center}.knob{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#c6b99a,#494239);border:2px solid #d9c79f}.skills{position:absolute;z-index:4;right:12px;bottom:12px;display:flex;align-items:end;gap:6px}.skill{width:47px;height:47px;border-radius:50%;border:2px solid #d5b36f;background:radial-gradient(circle at 35% 25%,#8266bc,#24153c);color:white;font-size:19px}.skill.main{width:66px;height:66px;font-size:27px;background:radial-gradient(circle at 35% 25%,#f5d58a,#9b431b 60%,#32140b)}.skilllabel{text-align:center;font-size:9px;text-shadow:0 2px 3px #000}.chat{position:absolute;z-index:3;left:135px;bottom:10px;width:min(340px,36vw);padding:7px 9px;background:#17130fc9;border-radius:8px;font-size:10px}.chat b{color:#f2cf79}.panel{position:absolute;z-index:8;inset:0;display:none;align-items:center;justify-content:center;background:#0009;padding:15px}.panel.open{display:flex}.panelbox{width:min(480px,92vw);padding:16px;max-height:82%;overflow:auto}.panelbox h2{margin:0 0 10px;color:#f2cf79}.panelbox p{font-size:13px;line-height:1.5}.panelbox button{background:#59432c;color:#fff0cc;border:1px solid #b99355;border-radius:8px;padding:9px;margin:4px}.toast{position:absolute;z-index:10;top:25%;left:50%;transform:translateX(-50%);display:none;background:#21180f;border:1px solid #f2cf79;padding:10px 14px;border-radius:9px;font-size:12px}.toast.show{display:block}@media(max-width:850px){.top{top:5px;left:5px;right:5px;gap:4px}.profile{min-width:112px;padding:4px 6px}.avatar{font-size:22px}.name{font-size:10px}.hp{width:70px}.nav{gap:2px}.nav button{padding:6px 5px;font-size:9px}.right{display:none}.quest{top:78px;left:6px;width:140px;font-size:9px;padding:6px}.currency{top:48px;left:6px;font-size:9px}.loc{top:49px;right:6px;font-size:9px}.joy{width:98px;height:98px;left:7px;bottom:7px}.ring{width:66px;height:66px}.knob{width:33px;height:33px}.skills{right:7px;bottom:7px;gap:3px}.skill{width:40px;height:40px;font-size:16px}.skill.main{width:58px;height:58px;font-size:24px}.skilllabel{font-size:8px}.chat{left:112px;bottom:7px;width:min(220px,35vw);font-size:9px;padding:5px}}
</style></head><body><div id="game"><canvas id="world"></canvas>
<header class="top"><div class="profile"><div class="avatar">🐭</div><div><div class="name" id="nick">Aventureiro</div><div class="meta">Nv. 1 · 100/100 HP</div><div class="hp"><i></i></div></div></div><nav class="nav"><button data-panel="Campanha">⚔ <strong>Campanha</strong></button><button data-panel="Mundo">🌍 Mundo</button><button data-panel="Missões">📜 Missões</button><button data-panel="Eventos">🎉 Eventos</button><button data-panel="Ranking">🏆 Ranking</button><button data-panel="Guilda">🛡 Guilda</button></nav><div class="right"><button data-panel="Configurações">⚙</button></div></header>
<div class="currency">🧀 0　🪙 0　💎 0</div><div class="loc">CONTINENTE DOS HERÓIS<br><b id="coords">Vila Inicial · 0, 0</b></div><div class="quest"><b>✦ MISSÃO PRINCIPAL</b><br>Encontre Lia, a guardiã.<br><span style="color:#c9b58d">Explore a vila e descubra sua aventura.</span></div>
<div class="right" style="position:absolute;right:9px;top:90px;z-index:4;display:flex;flex-direction:column"><button data-panel="Mochila">🎒 Mochila</button><button data-panel="Personagem">🧍 Herói</button><button data-panel="Mapa">🗺 Mapa</button></div>
<div class="chat"><b>[Mundo]</b> Bem-vindo a Ratópolis! Explore a Vila Inicial.<br><span style="color:#b6d0a2">Protótipo de mundo aberto.</span></div><div class="joy" id="joy"><div class="ring"><div class="knob" id="knob"></div></div></div>
<div class="skills"><div><button class="skill" data-skill="Poção">🧪</button><div class="skilllabel">Poção</div></div><div><button class="skill" data-skill="Defesa">🛡</button><div class="skilllabel">Defesa</div></div><div><button class="skill" data-skill="Investida">⚡</button><div class="skilllabel">Investida</div></div><div><button class="skill main" data-skill="Ataque">✦</button><div class="skilllabel">ATACAR</div></div></div>
<div class="panel" id="panel"><div class="panelbox"><button id="close" style="float:right">Fechar ✕</button><h2 id="ptitle"></h2><div id="pcontent"></div></div></div><div class="toast" id="toast"></div></div>
<script>(()=>{const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1;const player={x:0,y:0,speed:185};let joy={x:0,y:0},keys={};const trees=[],houses=[],rocks=[];function resize(){let portrait=matchMedia('(orientation:portrait)').matches;W=portrait?innerHeight:innerWidth;H=portrait?innerWidth:innerHeight;dpr=Math.min(2,devicePixelRatio||1);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!trees.length)populate()}function populate(){for(let i=0;i<100;i++){let x=(Math.random()-.5)*2600,y=(Math.random()-.5)*1900;if(Math.abs(x)<230&&Math.abs(y)<160)continue;trees.push({x,y,s:.65+Math.random()*.8})}for(let i=0;i<15;i++)houses.push({x:(i%5-2)*330,y:(Math.floor(i/5)-1)*330-170,w:110+Math.random()*25,h:80+Math.random()*20,k:i%3});for(let i=0;i<55;i++)rocks.push({x:(Math.random()-.5)*1900,y:(Math.random()-.5)*1300,s:3+Math.random()*8})}function iso(x,y){let dx=x-player.x,dy=y-player.y;return{x:W/2+(dx-dy)*.72,y:H*.53+(dx+dy)*.38}}function poly(a,color,stroke){ctx.beginPath();a.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}function tile(x,y,rx,ry,color){let p=iso(x,y);poly([{x:p.x,y:p.y-ry},{x:p.x+rx,y:p.y},{x:p.x,y:p.y+ry},{x:p.x-rx,y:p.y}],color)}function ground(){ctx.fillStyle='#304d31';ctx.fillRect(0,0,W,H);let t=80,gx=Math.floor(player.x/t),gy=Math.floor(player.y/t),cols=Math.ceil(W/58)+8,rows=Math.ceil(H/31)+8;for(let y=gy-rows/2;y<=gy+rows/2;y++)for(let x=gx-cols/2;x<=gx+cols/2;x++)tile(x*t,y*t,58,31,(x+y)%2?'#496f3d':'#527b43');for(let i=-22;i<=22;i++)tile(i*70,Math.sin(i*.22)*95+65,43,22,'#92764f')}function drawTree(o){let p=iso(o.x,o.y),s=o.s;ctx.fillStyle='#302318';ctx.fillRect(p.x-4*s,p.y-35*s,8*s,38*s);ctx.fillStyle='#203b26';ctx.beginPath();ctx.ellipse(p.x,p.y-47*s,27*s,35*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#527d3d';ctx.beginPath();ctx.ellipse(p.x-8*s,p.y-56*s,18*s,24*s,0,0,Math.PI*2);ctx.fill()}function drawHouse(h){let p=iso(h.x,h.y),w=h.w,z=h.h;poly([{x:p.x-w/2,y:p.y-z*.3},{x:p.x,y:p.y-z*.65},{x:p.x+w/2,y:p.y-z*.3},{x:p.x+w/2,y:p.y+z*.35},{x:p.x,y:p.y+z*.65},{x:p.x-w/2,y:p.y+z*.35}],'#77563b','#3d2a1d');poly([{x:p.x-w/2,y:p.y-z*.3},{x:p.x,y:p.y-z*.85},{x:p.x+w/2,y:p.y-z*.3},{x:p.x,y:p.y+z*.02}],['#70352a','#594333','#7d482d'][h.k],'#2c201a')}function npc(x,y,name,emoji){let p=iso(x,y);ctx.font='24px serif';ctx.textAlign='center';ctx.fillText(emoji,p.x,p.y);ctx.font='bold 10px system-ui';ctx.fillStyle='#fff0c9';ctx.fillText(name,p.x,p.y-27)}function draw(){ground();let all=[];trees.forEach(o=>all.push({z:o.x+o.y,fn:()=>drawTree(o)}));houses.forEach(o=>all.push({z:o.x+o.y,fn:()=>drawHouse(o)}));rocks.forEach(o=>all.push({z:o.x+o.y,fn:()=>{let p=iso(o.x,o.y);ctx.fillStyle='#888575';ctx.beginPath();ctx.ellipse(p.x,p.y,o.s,o.s*.6,0,0,7);ctx.fill()}}));all.push({z:player.x+player.y,fn:()=>{let p=iso(player.x,player.y);ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(p.x,p.y+5,15,7,0,0,7);ctx.fill();ctx.font='35px serif';ctx.textAlign='center';ctx.fillText('🐭',p.x,p.y);ctx.font='bold 10px system-ui';ctx.fillStyle='#ffe59b';ctx.fillText('VOCÊ',p.x,p.y-28)}});all.sort((a,b)=>a.z-b.z).forEach(o=>o.fn());npc(-105,-35,'Lia · Guardiã','🧝‍♀️');npc(155,105,'Mercador','🧔');npc(40,-220,'Ferreiro','🧑‍🏭')}function update(dt){let x=joy.x+(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=joy.y+(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0),l=Math.hypot(x,y)||1;if(Math.abs(x)+Math.abs(y)>.05){player.x+=x/l*player.speed*dt;player.y+=y/l*player.speed*dt}document.getElementById('coords').textContent='Vila Inicial · '+Math.round(player.x/10)+', '+Math.round(player.y/10)}let last=0;function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(frame)}const panel=document.getElementById('panel'),pt=document.getElementById('ptitle'),pc=document.getElementById('pcontent');function openPanel(n){pt.textContent=n;let d={Campanha:'Sua jornada começa na Vila Inicial. Complete missões e desbloqueie novas regiões.',Mundo:'Vila Inicial · Floresta dos Cogumelos · Minas Antigas · Vale Congelado · Terras Vulcânicas.',Missões:'Missão principal: encontre Lia, a guardiã. Missões secundárias serão adicionadas.',Eventos:'Nenhum evento ativo no protótipo.',Ranking:'O ranking será integrado ao servidor.',Guilda:'Guildas e masmorras serão desenvolvidas nas próximas etapas.',Mochila:'Sua mochila está vazia. Itens e equipamentos aparecerão aqui.',Personagem:'Ratinho · Nível 1 · 100 HP · Ataque 10 · Defesa 5.',Mapa:'Você está na Vila Inicial, no Continente dos Heróis.',Configurações:'Configurações de áudio, qualidade e tela cheia.'};pc.innerHTML='<p>'+(d[n]||'Em desenvolvimento.')+'</p><button id="back">Voltar ao mundo</button>';panel.classList.add('open');document.getElementById('back').onclick=()=>panel.classList.remove('open')}document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>openPanel(b.dataset.panel));document.getElementById('close').onclick=()=>panel.classList.remove('open');panel.onclick=e=>{if(e.target===panel)panel.classList.remove('open')};function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}document.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>toast(b.dataset.skill+' será ativado quando o combate for integrado.'));let je=document.getElementById('joy'),kn=document.getElementById('knob'),active=null;function move(e){let r=je.getBoundingClientRect(),m=r.width*.31,x=(e.clientX-r.left-r.width/2)/m,y=(e.clientY-r.top-r.height/2)/m,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joy={x,y};kn.style.transform='translate('+x*m*.75+'px,'+y*m*.75+'px)'}je.onpointerdown=e=>{active=e.pointerId;je.setPointerCapture(active);move(e)};je.onpointermove=e=>{if(e.pointerId===active)move(e)};function end(e){if(e.pointerId!==active)return;active=null;joy={x:0,y:0};kn.style.transform='translate(0,0)'}je.onpointerup=end;je.onpointercancel=end;onkeydown=e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>keys[e.key]=false;onblur=()=>{keys={};joy={x:0,y:0}};addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,120));resize();requestAnimationFrame(frame)})();</script></body></html>
