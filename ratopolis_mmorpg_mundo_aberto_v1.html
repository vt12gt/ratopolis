</style></head><body><canvas id="world"></canvas><div class="hud"><div class="top"><div class="profile glass"><div class="avatar">🐭</div><div><div class="name">AVENTUREIRO</div><div class="meta">Nível 01 · Rato Livre</div><div class="bars"><div class="bar"><i style="width:92%"></i></div><div class="bar xp"><i></i></div></div></div></div><div class="brand"><b>RATÓPOLIS</b><small>REINO DOS RATINHOS</small></div><div class="nav"><button data-msg="Campanhas em preparação"><span>✦</span> Campanhas</button><button data-msg="Inventário em preparação"><span>▣</span> Inventário</button><button data-msg="Mapa do reino em preparação"><span>⌖</span> Mapa</button><button data-msg="Amigos em preparação"><span>♧</span> Amigos</button></div><div class="right"><button data-msg="Configurações">⚙</button><button data-msg="Menu do jogador">☰</button></div></div><div class="loc">PRAÇA CENTRAL · LOBBY</div><div class="quest glass"><div class="eyebrow">BOAS-VINDAS</div><h3>Uma nova aventura!</h3><p>Explore a praça, conheça os moradores e prepare-se para descobrir o reino de Ratópolis.</p><button data-msg="As missões serão liberadas em breve">VER MISSÕES</button></div><div class="joy" id="joy"><div class="knob" id="knob"></div></div><div class="actions"><button class="action" data-msg="Emotes em preparação">☺<small>EMOTES</small></button><button class="action" data-msg="Habilidades em preparação">✧<small>PODERES</small></button><button class="action main" data-msg="Interações do Lobby em preparação">＋<small>INTERAGIR</small></button></div><div class="toast" id="toast"></div></div>
<script>
(()=>{const c=document.getElementById('world'),g=c.getContext('2d');let W,H,D,clock=0,last=0,player={x:0,y:0},cam={x:0,y:0},joy={x:0,y:0},keys={};const iso=(x,y)=>({x:(x-y)*39,y:(x+y)*19}),hash=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};function resize(){D=Math.min(devicePixelRatio||1,1.6);let portrait=innerHeight>innerWidth;W=portrait?innerHeight:innerWidth;H=portrait?innerWidth:innerHeight;c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(D,0,0,D,0,0)}function poly(a,col,stroke){g.beginPath();a.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=col;g.fill();if(stroke){g.strokeStyle=stroke;g.stroke()}}function oval(x,y,rx,ry,col){g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fillStyle=col;g.fill()}function tile(x,y,col){let p=iso(x,y);poly([{x:p.x,y:p.y-19},{x:p.x+39,y:p.y},{x:p.x,y:p.y+19},{x:p.x-39,y:p.y}],col)}function ground(){for(let y=-18;y<=18;y++)for(let x=-23;x<=23;x++){let n=hash(x,y),p=iso(x,y);tile(x,y,n>.8?'#86a96b':n>.35?'#789e61':'#6d9259');if(n>.91)oval(p.x+hash(y,x)*15-7,p.y,2,1,'#d2d18b')}for(let y=-18;y<=18;y++)for(let x=-23;x<=23;x++)if(Math.abs(x)<1.2||Math.abs(y)<1.2||(Math.abs(x-y)<1&&x>2&&x<9)){let p=iso(x,y);tile(x,y,(x+y)%2?'#b19b73':'#c0aa80');oval(p.x+hash(x,y)*14-7,p.y,2,1,'#e0cfaa')}}function tree(x,y,s=1){let p=iso(x,y);g.save();g.translate(p.x,p.y);g.scale(s,s);oval(2,5,22,9,'#354d32');poly([{x:-5,y:0},{x:5,y:0},{x:5,y:-31},{x:-5,y:-31}],'#795337');for(let i=0;i<3;i++){oval(-7,-35-i*10,18,16,['#3e7042','#4e8248','#60934e'][i]);oval(5,-39-i*9,13,13,['#56874b','#669650','#76a45a'][i])}oval(-10,-47,5,3,'#bbca7d');g.restore()}function house(x,y,s,col){let p=iso(x,y);g.save();g.translate(p.x,p.y);g.scale(s,s);oval(0,5,37,11,'#344c32');poly([{x:-29,y:-4},{x:25,y:-4},{x:25,y:-49},{x:-29,y:-49}],'#d8bd91','#8d704d');poly([{x:25,y:-4},{x:47,y:-17},{x:47,y:-59},{x:25,y:-49}],'#ad8e65','#806344');poly([{x:-36,y:-49},{x:0,y:-79},{x:35,y:-49},{x:25,y:-41},{x:0,y:-66},{x:-27,y:-41}],col,'#603d32');poly([{x:0,y:-66},{x:35,y:-49},{x:47,y:-59},{x:14,y:-84}],'#744039');poly([{x:-7,y:-4},{x:8,y:-4},{x:8,y:-31},{x:-7,y:-31}],'#684832');poly([{x:-23,y:-35},{x:-10,y:-35},{x:-10,y:-23},{x:-23,y:-23}],'#83aaa1','#765c3f');g.restore()}function fountain(){let p=iso(0,0);g.save();g.translate(p.x,p.y);oval(0,5,39,15,'#778a72');oval(0,0,33,13,'#c2c6ad');oval(0,-3,26,9,'#63939a');oval(0,-6,19,6,'#9ac9c4');poly([{x:-7,y:-5},{x:-5,y:-25},{x:5,y:-25},{x:7,y:-5}],'#c7b58d','#79694d');oval(0,-26,9,4,'#e1d0a4');g.strokeStyle='#c6f4ef';g.lineWidth=2;g.beginPath();g.moveTo(0,-25);g.quadraticCurveTo(-6,-34,0,-41);g.stroke();g.restore()}function lamp(x,y){let p=iso(x,y);g.save();g.translate(p.x,p.y);poly([{x:-2,y:0},{x:2,y:0},{x:2,y:-39},{x:-2,y:-39}],'#594735');oval(0,-42,7,9,'#665039');oval(0,-42,4,5,'#ffe49a');g.globalAlpha=.15;oval(0,-42,19,15,'#ffdf83');g.restore()}function rat(x,y,s=1,hero=false){let p=iso(x,y);g.save();g.translate(p.x,p.y+Math.sin(clock*5+x)*1.4);g.scale(s,s);oval(0,5,13,5,'#30432d');g.strokeStyle='#b7a18a';g.lineWidth=2.5;g.beginPath();g.moveTo(-8,0);g.quadraticCurveTo(-21,5,-19,12);g.stroke();oval(0,-6,10,10,hero?'#d0cabc':'#aaa99e');oval(-6,-14,6,7,'#c8c0b1');oval(6,-14,6,7,'#c8c0b1');oval(-6,-14,3,4,'#d98f8b');oval(6,-14,3,4,'#d98f8b');oval(0,-6,7,6,'#eee6d7');oval(-2,-7,1.4,1.6,'#292821');oval(3,-7,1.4,1.6,'#292821');oval(1,-3,2,1.5,'#a96969');if(hero){poly([{x:-9,y:-2},{x:0,y:-14},{x:9,y:-2}],'#ad4c40');oval(0,-15,3,3,'#f3d48a')}g.restore()}function flower(x,y){let p=iso(x,y);for(let i=0;i<5;i++){let a=i*6.283/5;oval(p.x+Math.cos(a)*3,p.y-5+Math.sin(a)*3,2,2,['#f4d28b','#e8a6a1','#eee5c4'][Math.floor(hash(x,y)*3)])}oval(p.x,p.y-5,1.5,1.5,'#d9a94e')}function world(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#9ab89e');bg.addColorStop(.55,'#c3d0a5');bg.addColorStop(1,'#799768');g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.translate(W/2-cam.x,H*.53-cam.y);ground();tree(-8,-5,1.25);tree(-10,0,1.1);tree(9,-7,1.2);tree(11,1,1.15);tree(-7,8,1);tree(8,8,1.1);house(-5,-4,1.15,'#a34e3e');house(6,-5,1.12,'#557b68');house(-7,5,.9,'#a87945');house(7,5,.94,'#8b5947');fountain();lamp(-3,-1);lamp(3,1);lamp(-2,4);lamp(2,-4);for(let i=0;i<45;i++){let x=(hash(i,4)-.5)*31,y=(hash(i,8)-.5)*26;if(Math.abs(x)>2||Math.abs(y)>2)flower(x,y)}for(let [x,y] of [[-3,3],[4,-2]]){let p=iso(x,y);poly([{x:p.x-15,y:p.y},{x:p.x+15,y:p.y},{x:p.x+15,y:p.y-6},{x:p.x-15,y:p.y-6}],'#79563a');poly([{x:p.x-12,y:p.y-6},{x:p.x-12,y:p.y-18},{x:p.x+12,y:p.y-18},{x:p.x+12,y:p.y-6}],'#b78a54')}rat(-3,-3,.9);rat(3,-2,.88);rat(4,3,.9);rat(-4,2,.82);rat(player.x,player.y,1.12,true);let gl=g.createRadialGradient(0,-30,20,0,-30,390);gl.addColorStop(0,'#ffe4a018');gl.addColorStop(1,'#14241c00');g.fillStyle=gl;g.fillRect(-W,-H,W*2,H*2);g.restore();let v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'#0000');v.addColorStop(1,'#15231955');g.fillStyle=v;g.fillRect(0,0,W,H)}const solids=[{x:-8,y:-5,rx:.62,ry:.62},{x:-10,y:0,rx:.58,ry:.58},{x:9,y:-7,rx:.62,ry:.62},{x:11,y:1,rx:.6,ry:.6},{x:-7,y:8,rx:.55,ry:.55},{x:8,y:8,rx:.58,ry:.58},{x:-5,y:-4,rx:1.05,ry:.88},{x:6,y:-5,rx:1.02,ry:.86},{x:-7,y:5,rx:.82,ry:.72},{x:7,y:5,rx:.84,ry:.74},{x:0,y:0,rx:.78,ry:.7},{x:-3,y:-1,rx:.22,ry:.22},{x:3,y:1,rx:.22,ry:.22},{x:-2,y:4,rx:.22,ry:.22},{x:2,y:-4,rx:.22,ry:.22},{x:-3,y:3,rx:.52,ry:.36},{x:4,y:-2,rx:.52,ry:.36}];function blocked(x,y){const radius=.23;for(const o of solids){const dx=(x-o.x)/(o.rx+radius),dy=(y-o.y)/(o.ry+radius);if(dx*dx+dy*dy<1)return true}return false}function tryMove(dx,dy){let nx=player.x+dx,ny=player.y;if(!blocked(nx,ny))player.x=nx;nx=player.x;ny=player.y+dy;if(!blocked(nx,ny))player.y=ny}let moveInput={x:0,y:0};function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;clock+=dt;let sx=joy.x,sy=joy.y;if(keys.ArrowLeft||keys.a)sx=-1;if(keys.ArrowRight||keys.d)sx=1;if(keys.ArrowUp||keys.w)sy=-1;if(keys.ArrowDown||keys.s)sy=1;let sl=Math.hypot(sx,sy);if(sl>1){sx/=sl;sy/=sl}if(sl<.12){sx=0;sy=0}let tx=(sx+sy)*.5,ty=(sy-sx)*.5;let smooth=1-Math.exp(-18*dt);moveInput.x+=(tx-moveInput.x)*smooth;moveInput.y+=(ty-moveInput.y)*smooth;if(Math.abs(moveInput.x)<.008)moveInput.x=0;if(Math.abs(moveInput.y)<.008)moveInput.y=0;tryMove(moveInput.x*dt*3.1,moveInput.y*dt*3.1);cam.x=(player.x-player.y)*39;cam.y=(player.x+player.y)*19;world();requestAnimationFrame(frame)}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),2100)}document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>toast(b.dataset.msg));let j=document.getElementById('joy'),k=document.getElementById('knob'),pid=null;function move(e){let portrait=innerHeight>innerWidth,px=portrait?e.clientY:e.clientX,py=portrait?innerWidth-e.clientX:e.clientY,r=j.getBoundingClientRect(),cx=portrait?r.top+r.height/2:r.left+r.width/2,cy=portrait?innerWidth-(r.left+r.width/2):r.top+r.height/2,travel=(r.width-k.offsetWidth)/2-5,x=(px-cx)/travel,y=(py-cy)/travel,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joy={x,y};k.style.transform='translate('+x*travel+'px,'+y*travel+'px)'}j.addEventListener('pointerdown',e=>{e.preventDefault();if(pid!==null)return;pid=e.pointerId;j.setPointerCapture(pid);move(e)});j.addEventListener('pointermove',e=>{if(pid===e.pointerId){e.preventDefault();move(e)}});function end(e){if(pid!==e.pointerId)return;pid=null;joy={x:0,y:0};k.style.transform='translate(0,0)'}j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end);j.addEventListener('lostpointercapture',()=>{pid=null;joy={x:0,y:0};k.style.transform='translate(0,0)'});onkeydown=e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()};onkeyup=e=>keys[e.key]=false;onblur=()=>{keys={};joy={x:0,y:0}};resize();addEventListener('resize',resize);requestAnimationFrame(frame)})();
