<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#243d32"><title>Ratópolis 3D — Lobby</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18251f;font-family:Georgia,serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;color:#fff0cb;text-shadow:0 2px 4px #17251dcc}.brand{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;padding:10px 14px;border:1px solid #dfc17b88;border-radius:13px;background:#1d3029d9;box-shadow:0 5px 20px #0005;font:bold 13px system-ui;letter-spacing:.12em}.brand small{display:block;color:#d6bc86;font-size:10px;letter-spacing:.2em;margin-top:3px}.help{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));padding:10px 13px;border:1px solid #dfc17b66;border-radius:12px;background:#1d3029cc;font:12px system-ui;color:#f6e7c5}.status{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);padding:8px 13px;border-radius:20px;background:#1d3029bb;border:1px solid #e2c27b66;font:11px system-ui;white-space:nowrap}.joystick{position:absolute;left:22px;bottom:max(24px,env(safe-area-inset-bottom));width:116px;height:116px;border:2px solid #e9d19b66;border-radius:50%;background:#182b2488;box-shadow:inset 0 0 25px #0005;pointer-events:auto;touch-action:none}.stick{position:absolute;width:48px;height:48px;left:32px;top:32px;border-radius:50%;background:linear-gradient(145deg,#f3d99c,#9b7845);border:3px solid #fff0c4;box-shadow:0 4px 12px #0008}.actions{position:absolute;right:18px;bottom:max(25px,env(safe-area-inset-bottom));display:flex;gap:10px;pointer-events:auto}.action{width:62px;height:62px;border-radius:18px;border:1px solid #f0d28a;background:linear-gradient(145deg,#d7b36d,#795738);color:#302419;font-weight:bold;font-size:11px;box-shadow:0 5px 14px #0008}.action:active{transform:scale(.95)}#hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 15px;border-radius:18px;background:#182b24d9;border:1px solid #e0c17b66;font:12px system-ui;opacity:0;transition:opacity .2s;white-space:nowrap}#hint.show{opacity:1}@media(orientation:portrait){.help{display:none}.status{top:70px}.joystick{width:100px;height:100px;left:12px}.stick{left:26px;top:26px}.actions{right:10px;gap:6px}.action{width:54px;height:54px}} 
</style>
</head>
<body><div id="game"></div><div id="hud">
<div class="brand">RATÓPOLIS <small>REINO DOS RATINHOS · LOBBY 3D</small></div>
<div class="status" id="status">PRAÇA CENTRAL · MAPA FECHADO</div>
<div class="help">WASD / SETAS · MOVER<br>Arraste para girar a câmera</div>
<div class="joystick" id="joy"><div class="stick" id="stick"></div></div>
<div class="actions"><button class="action" id="interact">ENTRAR</button><button class="action" id="jump">PULAR</button></div>
<div id="hint"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const host=document.getElementById('game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db6ad);scene.fog=new THREE.Fog(0x9db6ad,35,88);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,160);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe4f2df,0x63724e,2.0));
const sun=new THREE.DirectionalLight(0xffe4b3,2.5);sun.position.set(-18,30,16);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-34;sun.shadow.camera.right=34;sun.shadow.camera.top=34;sun.shadow.camera.bottom=-34;sun.shadow.bias=-.00025;scene.add(sun);
const mat=(color,roughness=.88)=>new THREE.MeshStandardMaterial({color,roughness});
const grass=mat(0x71945d),grass2=mat(0x7e9f67),earth=mat(0xb69a70),stone=mat(0xc5b48e),wood=mat(0x765239),cream=mat(0xe4d0a5),roofA=mat(0x914b3e),roofB=mat(0x526d5a),dark=mat(0x49382b),leaf1=mat(0x477449),leaf2=mat(0x5d8950),leaf3=mat(0x739b5a),flowerMats=[mat(0xf0d8a0),mat(0xd98d91),mat(0xb5a0d6)];
function box(parent,x,y,z,w,h,d,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function sphere(parent,x,y,z,r,m,sx=1,sy=1,sz=1){const o=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cylinder(parent,x,y,z,rt,rb,h,m,seg=10){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(54,46),grass);floor.rotation.x=-Math.PI/2;floor.position.y=-.08;floor.receiveShadow=true;scene.add(floor);
const groundPatch=new THREE.Mesh(new THREE.PlaneGeometry(49,41),grass2);groundPatch.rotation.x=-Math.PI/2;groundPatch.position.y=-.065;scene.add(groundPatch);
// Soft-edged finite map rim, stone edging and low timber fence
const bounds={x:24.5,z:20.5};
for(let x=-24;x<=24;x+=2){for(const z of [-20.5,20.5]){box(scene,x,.18,z,.16,.36,.16,wood);if(x<24)box(scene,x+1,.25,z,2,.12,.12,wood)}}
for(let z=-20;z<=20;z+=2){for(const x of [-24.5,24.5]){box(scene,x,.18,z,.16,.36,.16,wood);if(z<20)box(scene,x,.25,z,.12,.12,2,wood)}}
// Curved-looking branching paths from gate to central square
function path(points,width){for(let i=0;i<points.length-1;i++){const a=new THREE.Vector3(points[i][0],.015,points[i][1]),b=new THREE.Vector3(points[i+1][0],.015,points[i+1][1]);const d=b.clone().sub(a),mesh=new THREE.Mesh(new THREE.BoxGeometry(width,.045,d.length()+width*.45),earth);mesh.position.copy(a.add(b).multiplyScalar(.5));mesh.rotation.y=Math.atan2(d.x,d.z);mesh.receiveShadow=true;scene.add(mesh)}}
path([[0,20],[0,13],[1,8],[0,3],[0,-4],[0,-13],[0,-20]],3.8);path([[-23,2],[-15,2],[-9,1],[-4,0],[0,0],[7,-1],[14,-1],[23,-1]],3.2);
const plaza=new THREE.Mesh(new THREE.CircleGeometry(6.4,48),stone);plaza.rotation.x=-Math.PI/2;plaza.position.set(0,.035,0);plaza.receiveShadow=true;scene.add(plaza);
for(let i=0;i<36;i++){const a=i*Math.PI*2/36;const p=new THREE.Mesh(new THREE.BoxGeometry(.24,.035,.12),mat(0x9d8b6b));p.position.set(Math.cos(a)*5.6,.06,Math.sin(a)*5.6);p.rotation.y=-a;scene.add(p)}
// Detailed stylized houses
const colliders=[];
function house(x,z,scale,wallMat,roofMat,name){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(scale);scene.add(g);
box(g,0,1.35,0,3.8,2.7,3.1,wallMat);box(g,0,.72,1.58,1.05,1.45,.09,dark);box(g,-1.08,1.72,1.6,.76,.82,.1,mat(0x7db4b0));box(g,-1.08,1.72,1.67,.56,.62,.035,mat(0xc8e4d4));
const roof=new THREE.Mesh(new THREE.ConeGeometry(2.8,1.65,4),roofMat);roof.position.set(0,3.45,0);roof.rotation.y=Math.PI/4;roof.scale.set(1,1,1.05);roof.castShadow=true;g.add(roof);
box(g,0,2.68,1.62,3.95,.16,.18,wood);
const chimney=box(g,1.05,3.55,-.7,.48,1,.48,wood);chimney.rotation.z=-.08;
for(let side of [-1,1]){box(g,side*2.0,1.1,0,.18,2.2,.18,wood)}
colliders.push({x,z,r:2.5*scale,name});return g}
house(-10,-9,1.35,cream,roofA,'Casa da Vila');house(10,-9,1.35,mat(0xd3bd91),roofB,'Loja de Itens');house(-11,9,1.18,mat(0xc9b18c),roofB,'Oficina');house(11,9,1.2,mat(0xe0c99e),roofA,'Taverna');
// Tree clusters with trunks, tiered foliage, roots and stones
function tree(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);cylinder(g,0,1.35,0,.34,.48,2.7,wood,8);for(let k=0;k<3;k++){const r=1.55-k*.22;const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),[leaf1,leaf2,leaf3][k]);crown.position.set((k-1)*.12,2.8+k*.75,0);crown.scale.set(1,1.05,.9);crown.castShadow=true;g.add(crown)}colliders.push({x,z,r:1.05*s,name:'árvore'})}
[[-19,-13],[-18,1],[-18,15],[18,-14],[19,1],[18,15],[-7,-17],[8,-17],[-7,17],[8,17]].forEach(([x,z],i)=>tree(x,z,i%3===0?1.35:1));
function rock(x,z,s=1){const o=new THREE.Mesh(new THREE.DodecahedronGeometry(.8*s,0),mat(0x777c70));o.position.set(x,.48*s,z);o.scale.set(1,.72,1.2);o.rotation.set(.2,.6,.1);o.castShadow=true;o.receiveShadow=true;scene.add(o);colliders.push({x,z,r:.8*s,name:'pedra'})}
[[-5,-6],[5,7],[-17,8],[16,-7]].forEach(p=>rock(...p));
function lamp(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);cylinder(g,0,1,0,.09,.14,2,wood);box(g,0,2.2,0,.55,.65,.55,mat(0x384c48));box(g,0,2.2,0,.34,.43,.34,mat(0xf7d58a));const light=new THREE.PointLight(0xffd58a,1.3,7);light.position.set(0,2.2,0);g.add(light)}
[[-6,-5],[6,-5],[-6,5],[6,5],[-14,0],[14,0]].forEach(p=>lamp(...p));
function fountain(){const g=new THREE.Group();g.position.set(0,0,0);scene.add(g);cylinder(g,0,.22,0,2.15,2.15,.38,mat(0xbab49c),32);cylinder(g,0,.43,0,1.65,1.65,.12,mat(0x709d9a),32);cylinder(g,0,.75,0,.28,.38,.65,cream,12);sphere(g,0,1.15,0,.2,mat(0x9fd2d0));}
fountain();
// Flower patches, grass tufts and decorative shrubs
for(let i=0;i<180;i++){const x=(Math.sin(i*91.7)*.5+.5)*42-21,z=(Math.sin(i*37.1)*.5+.5)*34-17;if(Math.abs(x)<3&&Math.abs(z)<3)continue;const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);if(i%4===0){for(let k=0;k<5;k++)sphere(g,(k-2)*.12,.32+(k%2)*.1,0,.32,[leaf1,leaf2][k%2],1,.8,1)}else{for(let k=0;k<5;k++){const a=k*Math.PI*2/5;sphere(g,Math.cos(a)*.16,.22,Math.sin(a)*.16,.12,flowerMats[i%3],1,.65,1)}sphere(g,0,.24,0,.08,mat(0xe6bd68))}}
}
// Low-poly mouse hero with animated ears, tail and legs
function makeMouse(fur=0xb8aaa0,scarf=0xa94f43){const root=new THREE.Group();const body=new THREE.Group();root.add(body);const furM=mat(fur),pink=mat(0xd99198),belly=mat(0xeee1d0),eye=mat(0x211d1a),scarfM=mat(scarf);
sphere(body,0,.82,0,.57,furM,1,.9,1.25);sphere(body,0,1.12,.46,.43,furM,1,.95,.9);sphere(body,0,.98,.82,.27,belly,1,.7,.42);
for(const side of [-1,1]){sphere(body,side*.32,1.53,.42,.24,furM,1,.95,.7);sphere(body,side*.32,1.53,.59,.145,pink,1,.95,.5);sphere(body,side*.16,1.19,.79,.055,eye);sphere(body,side*.16,1.19,.84,.026,mat(0xffffff));}
sphere(body,0,1.02,1.03,.085,pink);
const scarfObj=new THREE.Mesh(new THREE.TorusGeometry(.39,.075,8,18),scarfM);scarfObj.position.set(0,1.02,.38);scarfObj.rotation.x=1.25;body.add(scarfObj);
const tail=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(0,.55,-.45),new THREE.Vector3(.18,.38,-.85),new THREE.Vector3(.42,.45,-1.12),new THREE.Vector3(.55,.65,-1.35)]),18,.045,7,false),pink);body.add(tail);
const legs=[];for(const side of [-1,1]){const leg=cylinder(body,side*.25,.28,.12,.105,.12,.45,furM,8);legs.push(leg);sphere(body,side*.25,.08,.28,.17,belly,1,.55,1)}
root.userData={body,legs,tail};return root}
const player=makeMouse();player.position.set(0,0,13);scene.add(player);const npcs=[];for(let i=0;i<7;i++){const npc=makeMouse([0xc5b7a8,0xa9b8a1,0xd1b58c,0xb9a5c5][i%4],[0x638e9c,0xb57c48,0x9a6d9d][i%3]);npc.position.set(-8+(i%4)*5,0,-5+Math.floor(i/4)*8);npc.userData.phase=i*1.7;scene.add(npc);npcs.push(npc)}
// Environment props
function sign(x,z){const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(g,0,1,0,.16,2,.16,wood);box(g,0,2,0,1.5,.75,.15,wood);box(g,0,2,.09,1.3,.56,.035,mat(0xd9c49a));}
sign(-14,-2);sign(14,2);
function gate(){const g=new THREE.Group();g.position.set(0,0,-20);scene.add(g);for(const x of [-2,2])box(g,x,2,0,.55,4,.55,wood);const top=box(g,0,4,0,5,.7,.8,roofA);top.rotation.z=.05;box(g,0,3.5,0,3,.13,.13,mat(0xe5c27a))}
gate();
// Collision and bounded map
function collides(x,z){if(Math.abs(x)>22.6||Math.abs(z)>18.7)return true;for(const c of colliders){if(Math.hypot(x-c.x,z-c.z)<c.r+.55)return true}return false}
const keys={};let joy={x:0,y:0},yaw=0,camYaw=0,drag=null,lastTap=0,near=null,jumpV=0,onGround=true;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){jump()}if(e.key.toLowerCase()==='e')interact()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function jump(){if(onGround){jumpV=5.3;onGround=false}}
function interact(){if(!near){hint('Chegue perto de uma construção para entrar.');return}hint('Entrada: '+near+' · interior será conectado nesta etapa.')}
function hint(t){const el=document.getElementById('hint');el.textContent=t;el.classList.add('show');clearTimeout(hint.timer);hint.timer=setTimeout(()=>el.classList.remove('show'),2300)}
document.getElementById('interact').onclick=interact;document.getElementById('jump').onclick=jump;
const joyEl=document.getElementById('joy'),stick=document.getElementById('stick');let joyPid=null;
joyEl.addEventListener('pointerdown',e=>{joyPid=e.pointerId;joyEl.setPointerCapture(joyPid);moveJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joyPid)moveJoy(e)});
function moveJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),m=Math.min(1,len/39);joy.x=len?dx/len*m:0;joy.y=len?dy/len*m:0;stick.style.transform='translate('+joy.x*30+'px,'+joy.y*30+'px)'}
function endJoy(){joyPid=null;joy.x=joy.y=0;stick.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerup',endJoy);joyEl.addEventListener('pointercancel',endJoy);
renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<130&&e.clientY>innerHeight-150)return;drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-drag.x;camYaw-=dx*.004;drag={x:e.clientX,y:e.clientY}}});
renderer.domElement.addEventListener('pointerup',()=>drag=null);renderer.domElement.addEventListener('pointercancel',()=>drag=null);
let prev=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-prev)/1000,.04);prev=now;
let ix=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iz=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const mag=Math.hypot(ix,iz);if(mag>1){ix/=mag;iz/=mag}
const moving=mag>.12;const speed=4.2;const forward=new THREE.Vector3(Math.sin(camYaw),0,Math.cos(camYaw)),right=new THREE.Vector3(forward.z,0,-forward.x);const delta=forward.multiplyScalar(iz*speed*dt).add(right.multiplyScalar(ix*speed*dt));if(moving){const nx=player.position.x+delta.x,nz=player.position.z+delta.z;if(!collides(nx,player.position.z))player.position.x=nx;if(!collides(player.position.x,nz))player.position.z=nz;yaw=Math.atan2(delta.x,delta.z);player.rotation.y+=(yaw-player.rotation.y)*Math.min(1,dt*12)}
const ud=player.userData;ud.body.position.y=moving?Math.abs(Math.sin(now*.012))*.09:Math.sin(now*.002)*.018;ud.legs.forEach((l,i)=>{l.rotation.x=moving?Math.sin(now*.014+i*Math.PI)*.55:0});ud.tail.rotation.y=Math.sin(now*.006)*.18;
if(!onGround){jumpV-=13*dt;player.position.y+=jumpV*dt;if(player.position.y<=0){player.position.y=0;jumpV=0;onGround=true}}
for(const n of npcs){const t=now*.0006+n.userData.phase;n.userData.body.position.y=Math.abs(Math.sin(t*2))*.035;n.rotation.y=Math.sin(t)*.22;n.userData.legs.forEach((l,i)=>l.rotation.x=Math.sin(t*3+i*Math.PI)*.12)}
near=null;let nd=999;for(const [name,x,z] of [['Casa da Vila',-10,-9],['Loja de Itens',10,-9],['Oficina',-11,9],['Taverna',11,9]]){const d=Math.hypot(player.position.x-x,player.position.z-z);if(d<5&&d<nd){nd=d;near=name}}
document.getElementById('status').textContent=near?'PERTO: '+near.toUpperCase():'PRAÇA CENTRAL · LOBBY 3D';
const desired=new THREE.Vector3(player.position.x-Math.sin(camYaw)*8,player.position.y+6.3,player.position.z-Math.cos(camYaw)*8);camera.position.lerp(desired,1-Math.exp(-dt*4.5));camera.lookAt(player.position.x,player.position.y+1.15,player.position.z);
renderer.render(scene,camera)}
requestAnimationFrame(animate);
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))}addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)endJoy()});
</script></body></html>
