<!DOCTYPE html>
<html lang="en" data-title-key="crossRoad.docTitle">
<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #1b2436 0%, #2f4059 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center;
    min-height: 100vh; min-height: 100svh; padding: 12px; user-select: none; touch-action: none;
  }
  .board-col { display: flex; flex-direction: column; align-items: center; }
  .wrap {
    position: relative;
    /* 画布 480×480：宽度同时受可用高度反推（下方还有 D-pad 与页脚），
       否则矮视口下画布底部被裁掉，滚也滚不到。1 = 480/480 */
    width: min(480px, 100%, max(180px, calc((100vh - 246px) * 1)));
    width: min(480px, 100%, max(180px, calc((100svh - 246px) * 1)));
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  canvas { display: block; width: 100%; height: auto; }
  .hud {
    position: absolute; top: 10px; left: 12px;
    background: rgba(12, 20, 32, .72); border-radius: 10px; padding: 6px 12px;
    color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 1px; pointer-events: none;
  }
  .hud small { display: block; font-size: 10px; font-weight: 600; opacity: .6; letter-spacing: 1px; }
  #mute-btn {
    position: absolute; top: 10px; right: 12px;
    width: 44px; height: 44px; border-radius: 10px; padding: 0;
    background: rgba(12,20,32,.72); border: none; color: #fff; font-size: 18px;
    cursor: pointer; z-index: 5;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 20px;
    background: rgba(12, 20, 32, .82); backdrop-filter: blur(3px); color: #fff;
  }
  .hidden { display: none !important; }
  .title { font-size: 32px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .title .sub { display: block; font-size: 12px; font-weight: 600; opacity: .7; letter-spacing: 4px; margin-top: 4px; }
  .icon-big { font-size: 48px; animation: float 2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-9px) } }
  .tip { font-size: 13.5px; opacity: .92; line-height: 1.75; }
  .tip b { color: #ffd76e; }
  .best { font-size: 13px; opacity: .7; }
  .score-final { font-size: 46px; font-weight: 800; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .medal { font-size: 32px; }
  .over-title { font-size: 19px; font-weight: 800; letter-spacing: 2px; }
  .over-reason { font-size: 13px; opacity: .82; }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  button {
    border: none; border-radius: 12px; padding: 12px 24px; min-height: 44px;
    font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button:active { transform: scale(.95); }
  .btn-primary { background: #45c06a; color: #fff; box-shadow: 0 5px 0 #2b8b49; }
  .btn-primary:active { box-shadow: 0 2px 0 #2b8b49; }
  .btn-ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .btn-ghost:active { box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .new-record {
    background: #ffd76e; color: #5a3e00; font-size: 12px; font-weight: 800;
    padding: 4px 14px; border-radius: 999px; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .dpad {
    margin-top: 10px;
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 50px);
    gap: 8px;
    width: min(480px, 100%, max(180px, calc((100vh - 246px) * 1)));
    width: min(480px, 100%, max(180px, calc((100svh - 246px) * 1)));
  }
  .dpad button {
    min-height: 50px; border-radius: 12px; font-size: 20px; font-weight: 800;
    background: rgba(255,255,255,.13); color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.28);
    padding: 0;
  }
  .dpad button:active { background: rgba(255,255,255,.28); }
  .dpad [data-dir="up"] { grid-column: 2; grid-row: 1; }
  .dpad [data-dir="left"] { grid-column: 1; grid-row: 2; }
  .dpad [data-dir="down"] { grid-column: 2; grid-row: 2; }
  .dpad [data-dir="right"] { grid-column: 3; grid-row: 2; }
  .footer {
    margin-top: 10px; color: rgba(255,255,255,.55); font-size: 12px;
    text-align: center; line-height: 1.9; max-width: 480px;
  }
  .footer a { color: rgba(255,255,255,.8); text-decoration: none; display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; }
  .footer a:hover { color: #ffd76e; }
</style>
<script src="../i18n.js"></script>
</head>
<body data-wg-home>

<div class="board-col">
  <div class="wrap" id="wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="hud"><small data-i18n="crossRoad.hudScore">STEPS</small><span id="hud-score">0</span></div>
    <button id="mute-btn" data-i18n-title="common.toggleSound" title="Toggle sound">🔊</button>

    <div class="overlay" id="start-overlay">
      <div class="icon-big">🐸</div>
      <div class="title"><span data-i18n="crossRoad.title">CROSS ROAD</span><span class="sub" data-i18n="crossRoad.subtitle">HOP · DODGE · RIDE</span></div>
      <div class="tip" data-i18n-html="crossRoad.tip">Hop <b>forward</b> one tile at a time. Dodge the cars.<br>On the water, stand on a <b>log</b> — miss it and you sink.<br>Swipe, use the pad below, or press <b>arrows / WASD</b>.</div>
      <div class="best" id="start-best"></div>

    </div>

    <div class="overlay hidden" id="over-overlay">
      <div class="medal" id="medal">🥉</div>

      <div class="new-record hidden" id="new-record" data-i18n="common.newRecord">🏆 NEW RECORD!</div>

      <div class="btn-row">
        <button class="btn-primary" id="btn-retry" data-i18n="common.playAgain">PLAY AGAIN</button>
        <button class="btn-ghost" id="btn-share" data-i18n="common.shareScore">SHARE SCORE</button>

    </div>
  </div>

  <div class="dpad" id="dpad">
    <button data-dir="up" data-i18n-aria="crossRoad.up" aria-label="Up">▲</button>
    <button data-dir="left" data-i18n-aria="crossRoad.left" aria-label="Left">◀</button>
    <button data-dir="down" data-i18n-aria="crossRoad.down" aria-label="Down">▼</button>

</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 480, H = 480, CELL = 48, BASE = H - 110;   // BASE = 玩家在屏幕上的固定 y

  function fitDPR() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitDPR();
  window.addEventListener('resize', fitDPR);

  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // ===== Sound =====
  var audioCtx = null, muted = false;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  var sfx = {
    hop:   function () { beep(560, 0.05, 'square', 0.05); },
    step:  function () { beep(700, 0.06, 'square', 0.055); },
    drown: function () { beep(300, 0.3, 'sine', 0.12); setTimeout(function () { beep(150, 0.35, 'sine', 0.1); }, 140); },
    crash: function () { beep(180, 0.22, 'sawtooth', 0.14); setTimeout(function () { beep(105, 0.3, 'sawtooth', 0.12); }, 120); }
  };
  var muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation(); muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ===== State =====
  var STATE = { READY: 0, PLAYING: 1, OVER: 2 };
  var state = STATE.READY;
  var BEST_KEY = 'cross_road_best_v1';
  var best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;

  var lanes, player, vis, camY, maxRow, deadKey, shake, lastTypes, timeAcc;

  function diffFactor(row) { return Math.min(1, Math.max(0, row) / 110); }

  // 每条车道都是一条「循环带」：物体按 L 取模无限滚动。
  // 这样车流永不中断，也不用写回收逻辑；画的时候画 x-L / x / x+L 三份即可。
  function makeLane(row) {
    if (row < 3) return { type: 'grass' };
    var d = diffFactor(row);
    var r = Math.random();
    var lastA = lastTypes[lastTypes.length - 1], lastB = lastTypes[lastTypes.length - 2];
    // 不允许连续三行都是同一种危险车道。
    // ★ 必须带 lastTypes.length >= 2:队列为空时 lastA/lastB 都是 undefined,
    //   undefined === undefined 为真 → r 被钉死 0.05 → 每一行都返回 grass,
    //   而 grass 不会入队 → 状态永不解开 → 整张地图清一色草地(无车流/无河流)。
    if (lastTypes.length >= 2 && lastA === lastB) r = 0.05;
    if (r < 0.28) return { type: 'grass' };

    if (r < 0.72) {
      var dir = Math.random() < 0.5 ? 1 : -1;
      var speed = (1.05 + Math.random() * 0.8 + d * 1.5) * dir;
      var cars = [], cx = 0;
      var minGap = (5.4 - d * 2.3) * CELL * (0.85 + Math.random() * 0.4);
      while (cx < W * 1.5) {
        var cw = (1.5 + Math.random() * 1.5) * CELL;
        cars.push({ x: cx, w: cw, c: (Math.random() * 5) | 0 });
        cx += cw + minGap * (0.75 + Math.random() * 0.5);
      }
      return { type: 'road', dir: dir, speed: speed, cars: cars, L: cx, off: Math.random() * cx };
    }

    var rdir = Math.random() < 0.5 ? 1 : -1;
    var rspeed = (0.5 + Math.random() * 0.5) * rdir;
    var logs = [], lx = 0;
    while (lx < W * 1.4) {
      var lw = (1.5 + Math.random() * 1.5) * CELL;
      logs.push({ x: lx, w: lw });
      lx += lw + (0.95 + Math.random() * 1.3) * CELL;
    }
    return { type: 'river', dir: rdir, speed: rspeed, logs: logs, L: lx, off: Math.random() * lx };
  }

  var GRASS_LANE = { type: 'grass' };
  function laneAt(row) {
    if (row < 0) return GRASS_LANE;
    if (!lanes[row]) {
      var made = makeLane(row);
      lanes[row] = made;
      // ★ 草地必须清空 streak。上一版只写了 else 分支(草地不入队),于是:
      //   出现「road, road」→ 守卫命中 → 强制返回草地 → 草地不入队 → lastTypes 永远停在
      //   ['road','road'] → 之后**每一行都被强制成草地** → 过完一条马路后前面全是草地、
      //   永远走不到头(2026-09-21 用户报告「没有尽头」)。
      //   正确语义:草地打断了"同类型连续",所以连击计数归零。
      if (made.type === 'grass') { lastTypes.length = 0; }
      else { lastTypes.push(made.type); if (lastTypes.length > 2) lastTypes.shift(); }
    }
    return lanes[row];
  }

  function reset() {
    lanes = []; lastTypes = [];
    player = { wx: W / 2, wy: CELL / 2 };
    vis = { x: player.wx, y: player.wy };
    camY = player.wy; maxRow = 0; deadKey = ''; shake = 0; timeAcc = 0;
    for (var i = 0; i <= 14; i++) laneAt(i);
    updateHud();
  }

  function updateHud() {
    document.getElementById('hud-score').textContent = maxRow;
  }

  var startOverlay = document.getElementById('start-overlay');
  var overOverlay = document.getElementById('over-overlay');
  function refreshBest() {
    document.getElementById('start-best').textContent = best > 0 ? t('common.bestScore', { n: best }) : t('crossRoad.first');
    document.getElementById('over-best').textContent = t('common.bestLabel', { n: best });
    if (deadKey) document.getElementById('over-reason').textContent = t(deadKey);
  }
  refreshBest();
  WG.onChange(refreshBest);

  // ===== Movement =====
  var lastMoveT = 0;
  var DEDUP_MS = 90;                 // < 长按阈值：三个事件源在同一瞬间只算一次

  function step(dir) {
    if (state === STATE.READY) { startGame(); return; }
    if (state !== STATE.PLAYING) return;
    var nx = player.wx, ny = player.wy;
    if (dir === 'left') nx -= CELL;
    else if (dir === 'right') nx += CELL;
    else if (dir === 'up') ny += CELL;
    else ny -= CELL;
    if (nx < CELL * 0.5 || nx > W - CELL * 0.5) return;         // 横向不出屏
    if (ny < CELL * 0.5 - CELL * 3) return;                      // 最多后退 3 行
    var moved = ny !== player.wy;
    player.wx = nx; player.wy = ny;
    laneAt(Math.floor(ny / CELL));
    if (moved && (ny / CELL - 0.5) > maxRow) { maxRow = Math.round(ny / CELL - 0.5); updateHud(); }
    sfx.hop();
  }
  function doMove(dir) {
    var now = Date.now();
    if (now - lastMoveT < DEDUP_MS) return;
    lastMoveT = now;
    step(dir);
  }

  var KEYDIR = {
    arrowleft: 'left', arrowright: 'right', arrowup: 'up', arrowdown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down'
  };
  window.addEventListener('keydown', function (e) {
    var k = String(e.key || '').toLowerCase();
    if (KEYDIR[k]) { e.preventDefault(); doMove(KEYDIR[k]); return; }
    if (k === ' ') { e.preventDefault(); if (state === STATE.READY) startGame(); else if (state === STATE.OVER) retry(); }
  });

  // 滑动：手指方向即前进方向
  var sx = 0, sy = 0, swiping = false;
  canvas.addEventListener('pointerdown', function (e) {
    sx = e.clientX; sy = e.clientY; swiping = true;
    if (canvas.setPointerCapture && e.pointerId !== undefined) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  canvas.addEventListener('pointerup', function (e) {
    if (!swiping) return;
    swiping = false;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    var adx = Math.abs(dx), ady = Math.abs(dy);
    if (Math.max(adx, ady) < 22) { if (state === STATE.READY) startGame(); return; }
    if (adx > ady) doMove(dx > 0 ? 'right' : 'left');
    else doMove(dy > 0 ? 'down' : 'up');
  });
  canvas.addEventListener('pointercancel', function () { swiping = false; });

  // D-pad：单击走一格，按住连续走
  var holdTimer = null;
  Array.prototype.forEach.call(document.querySelectorAll('#dpad button'), function (b) {
    function stopHold() { if (holdTimer) { clearInterval(holdTimer); holdTimer = null; } }
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      doMove(b.dataset.dir);
      stopHold();
      holdTimer = setInterval(function () { doMove(b.dataset.dir); }, 170);
    });
    ['pointerup', 'pointercancel', 'pointerleave', 'lostpointercapture'].forEach(function (ev) {
      b.addEventListener(ev, stopHold);
    });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  function startGame() {
    reset(); state = STATE.PLAYING;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
  }
  function retry() { startGame(); }
  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-retry').addEventListener('click', retry);

  document.getElementById('btn-share').addEventListener('click', function () {
    var full = t('crossRoad.share', { n: maxRow, url: location.href });
    function done() {
      var b = document.getElementById('btn-share');
      b.textContent = t('common.copied');
      setTimeout(function () { b.textContent = t('common.shareScore'); }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(done, function () { fallbackCopy(full, done); });
    } else fallbackCopy(full, done);
  });
  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  function die(reason) {
    if (state === STATE.OVER) return;
    state = STATE.OVER;
    deadKey = reason === 'car' ? 'crossRoad.overCar' : 'crossRoad.overWater';
    shake = 15;
    if (reason === 'car') sfx.crash(); else sfx.drown();
    var isRecord = maxRow > best;
    if (isRecord) { best = maxRow; localStorage.setItem(BEST_KEY, String(best)); }
    document.getElementById('medal').textContent = isRecord ? '👑' : (maxRow >= 40 ? '🥇' : '🥉');
    document.getElementById('new-record').classList.toggle('hidden', !isRecord);
    document.getElementById('final-score').textContent = maxRow;
    refreshBest();
    overOverlay.classList.remove('hidden');
  }

  // ===== Update =====
  var PLAYER_HALF = CELL * 0.28, CAR_HALF = CELL * 0.30;

  function wrapX(x, L) { var m = x % L; return m < 0 ? m + L : m; }

  function update(dt) {
    timeAcc += dt;
    var row = Math.floor(player.wy / CELL);
    var lane = laneAt(row);

    // 滚动所有循环带
    var r2 = Math.floor(player.wy / CELL) + 12;
    for (var i = Math.max(0, row - 3); i <= r2; i++) {
      var ln = laneAt(i);
      if (ln.type === 'grass') continue;
      ln.off = wrapX(ln.off + ln.speed * dt, ln.L);
    }

    if (lane.type === 'road') {
      for (var c = 0; c < lane.cars.length; c++) {
        var car = lane.cars[c];
        var bx = wrapX(car.x + lane.off, lane.L);
        for (var m = -1; m <= 1; m++) {
          var x0 = bx + m * lane.L;
          if (x0 + car.w < player.wx - PLAYER_HALF || x0 > player.wx + PLAYER_HALF) continue;
          die('car'); return;
        }
      }
    } else if (lane.type === 'river') {
      var onLog = null;
      for (var g = 0; g < lane.logs.length; g++) {
        var lg = lane.logs[g];
        var lx0 = wrapX(lg.x + lane.off, lane.L);
        for (var m2 = -1; m2 <= 1; m2++) {
          var lxx = lx0 + m2 * lane.L;
          if (player.wx >= lxx - 2 && player.wx <= lxx + lg.w + 2) { onLog = lg; break; }
        }
        if (onLog) break;
      }
      if (!onLog) { die('water'); return; }
      player.wx += lane.speed * dt;                       // 站在浮木上 -> 跟着漂
      laneAt(Math.floor(player.wy / CELL));
      if (player.wx < CELL * 0.4 || player.wx > W - CELL * 0.4) { die('water'); return; }
    }

    camY += (player.wy - camY) * Math.min(1, 0.16 * dt);
    vis.x += (player.wx - vis.x) * Math.min(1, 0.3 * dt);
    vis.y += (player.wy - vis.y) * Math.min(1, 0.3 * dt);
  }

  // ===== Draw =====
  function drawFrog(x, y) {
    var s = CELL * 0.62;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.22)';
    ctx.beginPath(); ctx.ellipse(0, s * 0.42, s * 0.46, s * 0.16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7ed957';
    ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2 + 2, s, s * 0.92, s * 0.34); ctx.fill();
    ctx.fillStyle = '#5cb83a';
    ctx.beginPath(); ctx.roundRect(-s / 2, s * 0.18, s, s * 0.28, s * 0.12); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-s * 0.21, -s * 0.24, s * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.21, -s * 0.24, s * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#17202b';
    ctx.beginPath(); ctx.arc(-s * 0.21, -s * 0.22, s * 0.075, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(s * 0.21, -s * 0.22, s * 0.075, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawCar(cx, topY, w, colorIdx) {
    var COLORS = ['#e8524a', '#f0a03c', '#4a90ff', '#c46bff', '#3ec9b0'];
    var h = CELL * 0.62, y = topY + (CELL - h) / 2;
    ctx.fillStyle = COLORS[colorIdx % COLORS.length];
    ctx.beginPath(); ctx.roundRect(cx, y, w, h, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.46)';
    ctx.beginPath(); ctx.roundRect(cx + w * 0.24, y + h * 0.16, w * 0.34, h * 0.38, 4); ctx.fill();
    ctx.fillStyle = 'rgba(20,26,36,.5)';
    ctx.beginPath(); ctx.roundRect(cx + w * 0.66, y + h * 0.16, w * 0.2, h * 0.38, 4); ctx.fill();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      shake *= 0.86; if (shake < 0.6) shake = 0;
    }
    ctx.fillStyle = '#1d2735';
    ctx.fillRect(-30, -30, W + 60, H + 60);

    var rMin = Math.floor((camY - (H - BASE)) / CELL) - 1;
    var rMax = Math.ceil((camY + BASE) / CELL) + 1;

    for (var r = rMin; r <= rMax; r++) {
      var topY = BASE - ((r + 1) * CELL - camY);
      var lane = laneAt(r);

      if (lane.type === 'grass') {
        ctx.fillStyle = (r % 2 === 0) ? '#63b653' : '#5aab4b';
        ctx.fillRect(0, topY, W, CELL);
        var seed = (r * 9301 + 49297) % 233280;
        ctx.fillStyle = 'rgba(255,255,255,.14)';
        for (var k = 0; k < 5; k++) {
          seed = (seed * 9301 + 49297) % 233280;
          var gx = (seed / 233280) * W;
          seed = (seed * 9301 + 49297) % 233280;
          var gy = topY + 6 + (seed / 233280) * (CELL - 12);
          ctx.beginPath(); ctx.roundRect(gx, gy, 5, 2, 1); ctx.fill();
        }
      } else if (lane.type === 'road') {
        ctx.fillStyle = '#3b4049';
        ctx.fillRect(0, topY, W, CELL);
        ctx.strokeStyle = 'rgba(255,255,255,.26)';
        ctx.lineWidth = 3; ctx.setLineDash([16, 16]);
        ctx.beginPath(); ctx.moveTo(0, topY + CELL / 2); ctx.lineTo(W, topY + CELL / 2); ctx.stroke();
        ctx.setLineDash([]);
        for (var c = 0; c < lane.cars.length; c++) {
          var car = lane.cars[c];
          var bx = wrapX(car.x + lane.off, lane.L);
          for (var m = -1; m <= 1; m++) {
            var cx2 = bx + m * lane.L;
            if (cx2 + car.w < 0 || cx2 > W) continue;
            drawCar(cx2, topY, car.w, car.c);
          }
        }
      } else {
        ctx.fillStyle = '#2f6cc0';
        ctx.fillRect(0, topY, W, CELL);
        ctx.strokeStyle = 'rgba(255,255,255,.16)';
        ctx.lineWidth = 2;
        for (var wv = 0; wv < 3; wv++) {
          var wy2 = topY + 10 + wv * 14;
          var ph = Math.sin((timeAcc * 0.03) + r + wv) * 22;
          ctx.beginPath(); ctx.moveTo(ph, wy2); ctx.lineTo(ph + 46, wy2); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(ph + 190, wy2); ctx.lineTo(ph + 236, wy2); ctx.stroke();
        }
        for (var g = 0; g < lane.logs.length; g++) {
          var lg = lane.logs[g];
          var lx0 = wrapX(lg.x + lane.off, lane.L);
          for (var m2 = -1; m2 <= 1; m2++) {
            var lxx = lx0 + m2 * lane.L;
            if (lxx + lg.w < 0 || lxx > W) continue;
            var lh = CELL * 0.6, ly = topY + (CELL - lh) / 2;
            ctx.fillStyle = '#a9743f';
            ctx.beginPath(); ctx.roundRect(lxx, ly, lg.w, lh, 8); ctx.fill();
            ctx.fillStyle = 'rgba(80,44,16,.42)';
            ctx.beginPath(); ctx.roundRect(lxx + 8, ly + lh * 0.34, lg.w - 16, 3, 2); ctx.fill();
            ctx.beginPath(); ctx.roundRect(lxx + 8, ly + lh * 0.64, lg.w - 16, 3, 2); ctx.fill();
          }
        }
      }
    }

    if (state !== STATE.OVER) drawFrog(vis.x, BASE - (vis.y - camY));

    ctx.restore();
  }

  // ===== Loop =====
  var last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);              // ★ 先排帧
    var dt = Math.min((now - last) / 16.666, 2.5);
    last = now;
    if (state === STATE.PLAYING) update(dt);
    else { camY += (player.wy - camY) * 0.16; vis.x += (player.wx - vis.x) * 0.3; vis.y += (player.wy - vis.y) * 0.3; }
    draw();
  }
  document.addEventListener('visibilitychange', function () { last = performance.now(); });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
