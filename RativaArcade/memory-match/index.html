<!DOCTYPE html>
<html lang="en" data-title-key="memoryMatch.docTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Memory Match — Free Online Memory Card Game</title>
<meta name="description" content="Play Memory Match free in your browser. Flip the cards, find every pair, and beat your best in three difficulties. No install, no signup, mobile and desktop.">
<meta name="keywords" content="memory game,memory match,card matching game,concentration game,pairs game,free online game,html5 game">
<meta name="author" content="mashukui">
<meta property="og:title" content="Memory Match — Free Online Memory Card Game">
<meta property="og:description" content="Flip two cards, find the pair. Three difficulties and a best score to beat.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --cs: min(76px, 19vw, 12vh);
    --cs: min(76px, 19vw, 12svh);
  }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #1a2a3a 0%, #2d4a5e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center;
    min-height: 100vh; min-height: 100svh; padding: 14px 12px; user-select: none;
  }
  .wrap {
    position: relative; width: min(400px, 100%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 18px 16px 20px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  #mute-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,255,255,.16); border-radius: 10px; color: #fff;
    width: 40px; height: 40px; font-size: 18px; padding: 0;
    cursor: pointer; z-index: 6; box-shadow: none; border: none;
  }
  .head { text-align: center; }
  .head h1 { font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #fff; }
  .head .sub { margin-top: 4px; font-size: 10px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,.6); }
  .modes { display: flex; gap: 6px; }
  .mode {
    border: none; border-radius: 999px; padding: 10px 14px; min-height: 44px;
    background: rgba(255,255,255,.1); color: rgba(255,255,255,.75);
    font-family: inherit; font-size: 11px; font-weight: 800; letter-spacing: .8px;
    cursor: pointer; transition: background .15s, color .15s;
  }
  .mode:hover { background: rgba(255,255,255,.18); }
  .mode.active { background: #ff9f1c; color: #fff; }
  .stats { display: flex; gap: 8px; width: 100%; }
  .stat {
    flex: 1; text-align: center; background: rgba(255,255,255,.07);
    border-radius: 12px; padding: 7px 4px;
  }
  .stat .val { font-size: 18px; font-weight: 800; color: #fff; line-height: 1.15; }
  .stat small { display: block; margin-top: 2px; font-size: 9px; font-weight: 700;
    letter-spacing: 1px; color: rgba(255,255,255,.6); }
  .board {
    display: grid;
    grid-template-columns: repeat(4, var(--cs));
    gap: 8px;
    justify-content: center;
  }
  .card {
    width: var(--cs); height: var(--cs);
    background: none; border: none; padding: 0; cursor: pointer;
    perspective: 700px; font-family: inherit;
  }
  .card .inner {
    /* ★ display:block 必须写:它是 <span>,默认 display:inline,
       而行内元素的 width/height:100% 会被直接忽略 —— .inner 塌成 0×0,
       两个牌面(absolute; inset:0)以 0×0 为包含块跟着塌,整副牌在屏幕上不画任何东西。
       现象 = 点牌"毫无反应"(处理器照跑,但画面零变化)。 */
    display: block;
    position: relative; width: 100%; height: 100%;
    transition: transform .32s cubic-bezier(.4,.8,.4,1);
    transform-style: preserve-3d;
  }
  .card.flipped .inner, .card.matched .inner { transform: rotateY(180deg); }
  .card:not(.flipped):not(.matched):active .inner { transform: scale(.94); }
  .face {
    position: absolute; inset: 0; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    font-size: calc(var(--cs) * .5); line-height: 1;
  }
  .face.back {
    background: linear-gradient(150deg, #5b95bd, #2f5f80);
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 0 3px 8px rgba(0,0,0,.35);
    color: rgba(255,255,255,.8); font-size: calc(var(--cs) * .34); font-weight: 800;
  }
  .face.front {
    background: #fff6e3; transform: rotateY(180deg);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,.06);
  }
  .card.matched { cursor: default; }
  .card.matched .face.front { background: #bff0c4; animation: pop .3s ease; }
  /* ★ 压暗只能写在叶子 .face 上,绝不能写 .card.matched .inner{opacity:.78}:
     opacity<1 会为 .inner 创建分组 → 它的 transform-style:preserve-3d 被强制降级为 flat
     → 两个 .face 的 3D 层叠立刻失效 → .face.back 不再被判为"背面朝前"而继续可见、
     .face.front 反被判为背面朝前而隐藏。
     现象 = 配对成功的那两张牌"又翻回背面"(还是镜像的),而 .matched 类、transform、剩余对数、
     结算面板全是对的 —— 状态层全绿、画面全错。
     注意 getComputedStyle().transformStyle 仍返回 'preserve-3d'(声明值),读不出这次降级,
     判据只能用像素。 */
  .card.matched .face { opacity: .78; }
  @keyframes pop { 0% { transform: rotateY(180deg) scale(1) } 50% { transform: rotateY(180deg) scale(1.12) } 100% { transform: rotateY(180deg) scale(1) } }
  button.btn {
    border: none; border-radius: 12px; padding: 12px 24px; min-height: 44px;
    font-size: 14px; font-weight: 800; letter-spacing: 1px; cursor: pointer;
    font-family: inherit; transition: transform .12s ease, box-shadow .12s ease;
  }
  button.btn:active { transform: scale(.95); }
  .btn-primary { background: #ff9f1c; color: #fff; box-shadow: 0 4px 0 #c47a0e; }
  .btn-ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .tip { font-size: 11px; color: rgba(255,255,255,.5); text-align: center; line-height: 1.5; }
  .overlay {
    position: absolute; inset: 0; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 20px;
    background: rgba(15, 30, 40, .82); backdrop-filter: blur(3px); color: #fff; z-index: 5;
  }
  .hidden { display: none !important; }
  .overlay .medal { font-size: 44px; }
  .overlay .ov-title { font-size: 19px; font-weight: 800; letter-spacing: 2px; }
  .overlay .ov-score { font-size: 15px; opacity: .85; }
  .new-record {
    background: #ffd76e; color: #5a3e00; font-size: 12px; font-weight: 800;
    padding: 4px 14px; border-radius: 999px; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .footer {
    margin-top: 16px; color: rgba(255,255,255,.55); font-size: 12px;
    text-align: center; line-height: 1.8;
  }
  .footer a { color: rgba(255,255,255,.8); text-decoration: none; }
  .footer a:hover { color: #ffd76e; }
  /* Short viewports: the hard deck is 6 rows tall, so drop the extra chrome
     and tighten the gaps to keep every card on screen. */
  @media (max-height: 720px) {
    .wrap { gap: 8px; padding: 12px 14px 14px; }
    .head .sub, .tip { display: none; }
    .stat { padding: 5px 4px; }
    .stat small { font-size: 8px; }
  }
  @media (max-height: 480px) {
    .head h1 { font-size: 18px; }
    .stats { display: none; }
  }
</style>
<script src="../i18n.js"></script>
</head>
<body data-wg-home>

<div class="wrap" id="wrap">
  <button id="mute-btn" data-i18n-title="common.toggleSound" title="Toggle sound">🔊</button>
  <div class="head">
    <h1 data-i18n="memoryMatch.title">MEMORY MATCH</h1>
    <div class="sub" data-i18n="memoryMatch.subtitle">FIND EVERY PAIR</div>
  </div>

  <div class="modes" id="modes"></div>

  <div class="stats">
    <div class="stat"><div class="val" id="st-pairs">0</div><small data-i18n="memoryMatch.hudPairs">PAIRS</small></div>
    <div class="stat"><div class="val" id="st-moves">0</div><small data-i18n="memoryMatch.hudMoves">MOVES</small></div>
    <div class="stat"><div class="val" id="st-time">0:00</div><small data-i18n="memoryMatch.hudTime">TIME</small></div>
  </div>

  <div class="board" id="board"></div>
  <div class="tip" id="tip"></div>

  <div class="overlay hidden" id="overlay">
    <div class="medal" id="ov-medal">🏆</div>
    <div class="ov-title" data-i18n="memoryMatch.winTitle">ALL PAIRS FOUND!</div>
    <div class="ov-score" id="ov-score"></div>
    <div class="new-record hidden" id="new-record" data-i18n="common.newRecord">🏆 NEW RECORD!</div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-again" data-i18n="common.playAgain">PLAY AGAIN</button>
      <button class="btn btn-ghost" id="btn-share" data-i18n="common.shareScore">SHARE SCORE</button>
    </div>
  </div>
</div>

<div class="footer">
  <span data-i18n="common.madeBy">Made by</span> <a href="https://github.com/mashukui" target="_blank" rel="noopener">@mashukui</a> ·
  <a href="../" data-i18n="common.moreGames">🎮 More games</a> ·
  <a href="https://github.com/mashukui/web-games" target="_blank" rel="noopener">GitHub</a> ·
  <a href="https://saveone.pro" target="_blank" rel="noopener">SaveOne</a> <span data-i18n="common.freeVideo">— free online video downloader</span>
</div>

<script>
(function () {
  'use strict';

  // ===== Sound =====
  var audioCtx = null, muted = false;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  var sfx = {
    flip:  function () { beep(520, 0.05, 'sine', 0.05); },
    match: function (n) { beep(660 + Math.min(n, 6) * 60, 0.09, 'triangle', 0.09); setTimeout(function () { beep(990, 0.11, 'triangle', 0.07); }, 80); },
    miss:  function () { beep(220, 0.12, 'sine', 0.06); },
    win:   function () { [0, 110, 220, 340].forEach(function (d, i) { setTimeout(function () { beep(520 + i * 180, 0.14, 'triangle', 0.09); }, d); }); }
  };
  var muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation(); muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ===== Config =====
  var EMOJI = ['🐶','🐱','🦊','🐼','🐸','🦁','🐵','🦄','🐝','🦋','🐙','🐳','🦉','🐢','🍀','⭐','🍉','🎈','🚀','🌵','🍩','🐧','🦖','🌻'];
  var LEVELS = {
    easy:   { cols: 4, pairs: 6 },
    medium: { cols: 4, pairs: 8 },
    hard:   { cols: 4, pairs: 12 }
  };
  var MODES = ['easy', 'medium', 'hard'];
  var BEST_KEY = 'memory_match_best_v1';

  // ===== State =====
  var mode = 'easy';
  var deck = [], flipped = [], matchedCount = 0, moves = 0, lock = false;
  var startedAt = 0, elapsed = 0, running = false, ticker = null;
  var bests = loadBests();
  var cards = [];

  function loadBests() {
    try { return JSON.parse(localStorage.getItem(BEST_KEY) || '{}') || {}; }
    catch (e) { return {}; }
  }
  function saveBests() {
    try { localStorage.setItem(BEST_KEY, JSON.stringify(bests)); } catch (e) {}
  }

  // ===== DOM =====
  var boardEl = document.getElementById('board');
  var modesEl = document.getElementById('modes');
  var tipEl = document.getElementById('tip');
  var overlay = document.getElementById('overlay');

  function fmtTime(ms) {
    var s = Math.floor(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function renderModes() {
    modesEl.innerHTML = '';
    var labels = { easy: t('memoryMatch.modeEasy'), medium: t('memoryMatch.modeMedium'), hard: t('memoryMatch.modeHard') };
    MODES.forEach(function (m) {
      var b = document.createElement('button');
      b.className = 'mode' + (m === mode ? ' active' : '');
      b.type = 'button';
      b.textContent = labels[m];
      b.dataset.mode = m;
      b.addEventListener('click', function () {
        if (mode === m) return;
        mode = m;
        renderModes();
        newGame();
      });
      modesEl.appendChild(b);
    });
  }

  function renderStats() {
    var total = LEVELS[mode].pairs;
    document.getElementById('st-pairs').textContent = (total - matchedCount) + '/' + total;
    document.getElementById('st-moves').textContent = moves;
    document.getElementById('st-time').textContent = fmtTime(elapsed);
  }

  function renderTip() {
    var b = bests[mode];
    if (b && b.moves) {
      tipEl.textContent = t('memoryMatch.bestLine', { moves: b.moves, time: fmtTime(b.ms) });
    } else {
      tipEl.textContent = t('memoryMatch.first');
    }
  }

  function refreshAll() { renderModes(); renderStats(); renderTip(); }

  // ===== Game =====
  function newGame() {
    var cfg = LEVELS[mode];
    var pool = EMOJI.slice();
    // shuffle the emoji pool so every round feels different
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    deck = [];
    for (var p = 0; p < cfg.pairs; p++) { deck.push(pool[p]); deck.push(pool[p]); }
    for (var k = deck.length - 1; k > 0; k--) {
      var l = Math.floor(Math.random() * (k + 1));
      var t2 = deck[k]; deck[k] = deck[l]; deck[l] = t2;
    }

    flipped = []; matchedCount = 0; moves = 0; lock = false;
    elapsed = 0; startedAt = 0; running = false;
    if (ticker) { clearInterval(ticker); ticker = null; }
    overlay.classList.add('hidden');
    document.getElementById('new-record').classList.add('hidden');

    boardEl.innerHTML = '';
    cards = [];
    deck.forEach(function (sym, idx) {
      var btn = document.createElement('button');
      btn.className = 'card';
      btn.type = 'button';
      btn.dataset.i = String(idx);
      btn.setAttribute('aria-label', t('memoryMatch.cardAria', { n: idx + 1 }));
      btn.innerHTML = '<span class="inner"><span class="face back">?</span><span class="face front">' + sym + '</span></span>';
      btn.addEventListener('click', function () { onFlip(idx); });
      boardEl.appendChild(btn);
      cards.push(btn);
    });

    renderStats();
    renderTip();
  }

  function startClock() {
    if (running) return;
    running = true;
    startedAt = Date.now() - elapsed;
    ticker = setInterval(function () {
      elapsed = Date.now() - startedAt;
      document.getElementById('st-time').textContent = fmtTime(elapsed);
    }, 200);
  }

  function onFlip(idx) {
    if (lock) return;
    var card = cards[idx];
    if (!card || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    startClock();
    card.classList.add('flipped');
    sfx.flip();
    flipped.push(idx);
    if (flipped.length < 2) return;

    moves++;
    document.getElementById('st-moves').textContent = moves;
    var a = flipped[0], b = flipped[1];
    if (deck[a] === deck[b]) {
      cards[a].classList.add('matched');
      cards[b].classList.add('matched');
      matchedCount++;
      flipped = [];
      document.getElementById('st-pairs').textContent = (LEVELS[mode].pairs - matchedCount) + '/' + LEVELS[mode].pairs;
      sfx.match(matchedCount);
      if (matchedCount === LEVELS[mode].pairs) finish();
    } else {
      lock = true;
      sfx.miss();
      setTimeout(function () {
        cards[a].classList.remove('flipped');
        cards[b].classList.remove('flipped');
        flipped = [];
        lock = false;
      }, 760);
    }
  }

  function finish() {
    running = false;
    if (ticker) { clearInterval(ticker); ticker = null; }
    sfx.win();
    var prev = bests[mode];
    var isRecord = !prev || !prev.moves || moves < prev.moves ||
      (moves === prev.moves && elapsed < prev.ms);
    if (isRecord) {
      bests[mode] = { moves: moves, ms: elapsed };
      saveBests();
    }
    document.getElementById('ov-score').textContent = t('memoryMatch.result', { moves: moves, time: fmtTime(elapsed) });
    document.getElementById('new-record').classList.toggle('hidden', !isRecord);
    document.getElementById('ov-medal').textContent =
      moves <= LEVELS[mode].pairs + 2 ? '👑' : isRecord ? '🥇' : '🎉';
    refreshAll();
    overlay.classList.remove('hidden');
  }

  document.getElementById('btn-again').addEventListener('click', function () { newGame(); });
  document.getElementById('btn-share').addEventListener('click', function () {
    var full = t('memoryMatch.share', { pairs: LEVELS[mode].pairs, moves: moves, time: fmtTime(elapsed), url: location.href });
    function done() {
      var b = document.getElementById('btn-share');
      b.textContent = t('common.copied');
      setTimeout(function () { b.textContent = t('common.shareScore'); }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(done, function () { fallbackCopy(full, done); });
    } else fallbackCopy(full, done);
  });
  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // keyboard: R restarts
  window.addEventListener('keydown', function (e) {
    if ((e.key || '').toLowerCase() === 'r') newGame();
  });

  // ===== Fit the cards to short viewports =====
  /* The hard deck is 6 rows tall. Measure the chrome, then shrink the cards so
     every row stays visible; a rating of the deck re-runs this automatically. */
  function fitBoard() {
    var root = document.documentElement;
    var wrapEl = document.getElementById('wrap');
    var gridEl = document.getElementById('board');
    var rows = Math.max(1, Math.ceil(gridEl.children.length / 4));
    root.style.setProperty('--cs', '76px');
    var other = wrapEl.offsetHeight - gridEl.offsetHeight;
    var avail = window.innerHeight - 24;
    var byH = Math.floor((avail - other - (rows - 1) * 8) / rows);
    var byW = Math.floor((Math.min(window.innerWidth, 400) - 24 - 32 - 24) / 4);
    var cs = Math.max(30, Math.min(76, byH, byW));
    root.style.setProperty('--cs', cs + 'px');
  }
  window.addEventListener('resize', fitBoard);

  // ===== Boot =====
  refreshAll();
  newGame();
  fitBoard();
  if (window.MutationObserver) {
    new MutationObserver(fitBoard).observe(document.getElementById('board'), { childList: true });
  }
  WG.onChange(function () {
    renderModes();
    renderTip();
    // the win overlay text is rebuilt from keys, so re-render it too
    if (!overlay.classList.contains('hidden')) {
      document.getElementById('ov-score').textContent = t('memoryMatch.result', { moves: moves, time: fmtTime(elapsed) });
    }
  });
})();
</script>
</body>
</html>
