<!DOCTYPE html>
<html lang="en" data-title-key="antFlap.docTitle">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ant Flap - Free Online HTML5 Game</title>
<meta name="description" content="Ant Flap — a free online HTML5 game. No install, no signup, just tap and fly! Guide the little ant through the branches. Works on mobile & desktop.">
<meta name="keywords" content="ant flap,free online game,html5 game,web game,flappy bird alternative,browser game,no install game,arcade game">
<meta name="author" content="mashukui">
<meta property="og:title" content="Ant Flap - Free Online Game">
<meta property="og:description" content="Guide a flying ant through the branches. Tap to flap, dodge everything, chase the high score!">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐜</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #1a2a3a 0%, #2d4a5e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center;
    min-height: 100vh; min-height: 100svh; padding: 12px; user-select: none;
  }
  .wrap {
    position: relative;
    /* 画布 420×640：宽度必须同时受「可用高度」反推约束，否则窄高视口(手机竖屏/笔记本)里
       wrap 被 flex 压扁、画布溢出被 overflow:hidden 裁掉，底部玩法区整个掉出屏幕。
       .656 ≈ 420/640 */
    width: min(420px, 100%, max(200px, calc((100vh - 130px) * .656)));
    width: min(420px, 100%, max(200px, calc((100svh - 130px) * .656)));
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: auto; }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
    background: rgba(15, 30, 40, .55);
    backdrop-filter: blur(3px);
    color: #fff;
  }
  .hidden { display: none !important; }
  .title {
    font-size: 40px; font-weight: 800; letter-spacing: 3px;
    text-shadow: 0 3px 0 rgba(0,0,0,.3);
  }
  .title .en { display: block; font-size: 13px; font-weight: 600; opacity: .75; letter-spacing: 5px; margin-top: 4px; }
  .ant-big { font-size: 64px; animation: float 2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  .tip { font-size: 15px; opacity: .9; line-height: 1.7; }
  .tip b { color: #ffd76e; }
  .best { font-size: 13px; opacity: .7; margin-top: 2px; }
  .score-final { font-size: 56px; font-weight: 800; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .medal { font-size: 40px; }
  .btn-row { display: flex; gap: 12px; margin-top: 6px; }
  button {
    border: none; border-radius: 12px; padding: 12px 26px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    font-family: inherit;
  }
  button:active { transform: scale(.95); }
  .btn-primary { background: #ff9f1c; color: #fff; box-shadow: 0 5px 0 #c47a0e; }
  .btn-primary:active { box-shadow: 0 2px 0 #c47a0e; }
  .btn-ghost { background: rgba(255,255,255,.15); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  .btn-ghost:active { box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .new-record {
    background: #ffd76e; color: #5a3e00; font-size: 12px; font-weight: 800;
    padding: 4px 14px; border-radius: 999px; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  #hud {
    position: absolute; top: 14px; left: 0; right: 0;
    display: flex; justify-content: center; pointer-events: none;
  }
  #score-display {
    font-size: 44px; font-weight: 800; color: #fff;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 18px rgba(0,0,0,.2);
  }
  #mute-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(255,255,255,.2); border-radius: 10px;
    width: 40px; height: 40px; font-size: 18px; padding: 0;
    cursor: pointer; z-index: 5; box-shadow: none;
  }
  .footer {
    margin-top: 16px; color: rgba(255,255,255,.55); font-size: 12px;
    text-align: center; line-height: 1.8;
  }
  .footer a { color: rgba(255,255,255,.8); text-decoration: none; }
  .footer a:hover { color: #ffd76e; }
</style>
<script src="../i18n.js"></script>
</head>
<body data-wg-home>

<div class="wrap" id="wrap">
  <canvas id="game" width="420" height="640"></canvas>
  <div id="hud"><div id="score-display">0</div></div>
  <button id="mute-btn" title="Toggle sound" data-i18n-title="common.toggleSound">🔊</button>

  <div class="overlay" id="start-overlay">
    <div class="ant-big">🐜</div>
    <div class="title"><span data-i18n="antFlap.title">ANT FLAP</span><span class="en" data-i18n="antFlap.subtitle">A TINY FLYING ANT ADVENTURE</span></div>
    <div class="tip" data-i18n-html="antFlap.tip">Tap the screen or press <b>SPACE</b> to flap<br>Squeeze through the branches — don't crash!</div>
    <div class="best" id="start-best"></div>
    <div class="btn-row"><button class="btn-primary" id="btn-start" data-i18n="common.start">START</button></div>
  </div>

  <div class="overlay hidden" id="over-overlay">
    <div class="medal" id="medal">🥉</div>
    <div class="score-final" id="final-score">0</div>
    <div class="new-record hidden" id="new-record" data-i18n="common.newRecord">🏆 NEW RECORD!</div>
    <div class="best" id="over-best"></div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-retry" data-i18n="common.playAgain">PLAY AGAIN</button>
      <button class="btn-ghost" id="btn-share" data-i18n="common.shareScore">SHARE SCORE</button>
    </div>
  </div>
</div>

<div class="footer">
  <span data-i18n="common.madeBy">Made by</span> <a href="https://github.com/mashukui" target="_blank" rel="noopener">@mashukui</a> ·
  <a href="../" data-i18n="common.moreGames">🎮 More games</a> ·
  <a href="https://github.com/mashukui/web-games" target="_blank" rel="noopener">GitHub</a> ·
  <a href="https://saveone.pro" target="_blank" rel="noopener">SaveOne</a> <span data-i18n="common.freeVideo">— free online video downloader</span>
</div>

<script>
(function () {
  'use strict';

  // ===== Canvas =====
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 420, H = 640, GROUND_H = 72;
  var GROUND_Y = H - GROUND_H;

  function fitDPR() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fitDPR();
  window.addEventListener('resize', fitDPR);

  // roundRect polyfill (older browsers)
  if (!ctx.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // ===== Sound (WebAudio, no external files) =====
  var audioCtx = null, muted = false;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) { /* silently degrade if audio unavailable */ }
  }
  var sfx = {
    flap:  function () { beep(520, 0.07, 'square', 0.06); },
    score: function () { beep(880, 0.09, 'sine', 0.12); setTimeout(function(){ beep(1175, 0.12, 'sine', 0.10); }, 90); },
    hit:   function () { beep(160, 0.25, 'sawtooth', 0.15); }
  };

  var muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ===== Game state =====
  var STATE = { READY: 0, PLAYING: 1, DYING: 2, OVER: 3 };
  var state = STATE.READY;

  var BEST_KEY = 'antflap_best_v1';
  var best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;

  var GRAVITY = 0.42, FLAP_V = -7.8, MAX_V = 11;
  var ant, pipes, particles, clouds, score, groundOffset, frames, spawnTimer, speed, shake;

  function reset() {
    ant = { x: W * 0.3, y: H * 0.42, vy: 0, r: 15, rot: 0, wing: 0 };
    pipes = [];
    particles = [];
    score = 0;
    groundOffset = 0;
    frames = 0;
    spawnTimer = 0;
    speed = 2.5;
    shake = 0;
    clouds = [
      { x: 60,  y: 90,  s: 1.1 },
      { x: 250, y: 150, s: 0.8 },
      { x: 400, y: 60,  s: 1.3 }
    ];
  }
  reset();

  // ===== DOM refs =====
  var startOverlay = document.getElementById('start-overlay');
  var overOverlay  = document.getElementById('over-overlay');
  var scoreDisplay = document.getElementById('score-display');
  var startBest    = document.getElementById('start-best');
  var finalScore   = document.getElementById('final-score');
  var overBest     = document.getElementById('over-best');
  var newRecord    = document.getElementById('new-record');
  var medal        = document.getElementById('medal');

  function refreshBestLabels() {
    startBest.textContent = best > 0 ? t('common.bestScore', { n: best }) : t('antFlap.first');
    overBest.textContent  = t('common.bestLabel', { n: best });
  }
  refreshBestLabels();
  WG.onChange(refreshBestLabels);   // keep "best score" line in the current language

  // ===== Input =====
  function flap() {
    if (state === STATE.READY) { startGame(); return; }
    if (state !== STATE.PLAYING) return;
    ant.vy = FLAP_V;
    ant.wing = 1;
    sfx.flap();
    for (var i = 0; i < 4; i++) {
      particles.push({
        x: ant.x - 12, y: ant.y + 8,
        vx: -1.5 - Math.random() * 1.5, vy: 1 + Math.random() * 2,
        life: 1, size: 2 + Math.random() * 2
      });
    }
  }

  document.getElementById('wrap').addEventListener('pointerdown', function (e) {
    if (e.target.closest('button')) return;
    e.preventDefault();
    flap();
  });
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (state === STATE.OVER) { retry(); return; }
      flap();
    }
  });

  function startGame() {
    state = STATE.PLAYING;
    startOverlay.classList.add('hidden');
    ant.vy = FLAP_V;
    sfx.flap();
  }

  function retry() {
    reset();
    refreshBestLabels();
    overOverlay.classList.add('hidden');
    state = STATE.PLAYING;
    ant.vy = FLAP_V;
    sfx.flap();
  }

  document.getElementById('btn-start').addEventListener('click', startGame);
  document.getElementById('btn-retry').addEventListener('click', retry);

  document.getElementById('btn-share').addEventListener('click', function () {
    var full = t('antFlap.share', { n: score, url: location.href });
    function done() {
      var b = document.getElementById('btn-share');
      b.textContent = t('common.copied');
      setTimeout(function () { b.textContent = t('common.shareScore'); }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(done, function () { fallbackCopy(full, done); });
    } else {
      fallbackCopy(full, done);
    }
  });

  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  // ===== Pipes (branches) =====
  var PIPE_W = 68, GAP_INIT = 165, GAP_MIN = 122;

  function currentGap() {
    return Math.max(GAP_MIN, GAP_INIT - score * 1.2);
  }
  function spawnPipe() {
    var gap = currentGap();
    var margin = 70;
    var gapY = margin + Math.random() * (GROUND_Y - gap - margin * 2);
    pipes.push({ x: W + 20, gapY: gapY, gap: gap, passed: false });
  }

  function circleRectHit(cx, cy, r, rx, ry, rw, rh) {
    var nx = Math.max(rx, Math.min(cx, rx + rw));
    var ny = Math.max(ry, Math.min(cy, ry + rh));
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die() {
    state = STATE.DYING;
    shake = 14;
    sfx.hit();
  }

  function gameOver() {
    state = STATE.OVER;
    var isRecord = score > best;
    if (isRecord) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    finalScore.textContent = score;
    newRecord.classList.toggle('hidden', !isRecord);
    refreshBestLabels();
    medal.textContent = score >= 30 ? '👑' : score >= 20 ? '🥇' : score >= 10 ? '🥈' : score >= 5 ? '🥉' : '🐛';
    overOverlay.classList.remove('hidden');
  }

  // ===== Update =====
  function update(dt) {
    frames++;
    // clouds always drift
    for (var c = 0; c < clouds.length; c++) {
      var cl = clouds[c];
      cl.x -= 0.25 * dt * cl.s;
      if (cl.x < -80) { cl.x = W + 80; cl.y = 40 + Math.random() * 160; }
    }

    if (state === STATE.READY) {
      ant.y = H * 0.42 + Math.sin(frames / 26) * 8;
      groundOffset = (groundOffset + speed * dt) % 40;
      return;
    }

    if (state === STATE.PLAYING || state === STATE.DYING) {
      ant.vy = Math.min(ant.vy + GRAVITY * dt, MAX_V);
      ant.y += ant.vy * dt;
      ant.rot = Math.max(-0.45, Math.min(0.9, ant.vy * 0.06));
      ant.wing = Math.max(0, ant.wing - 0.12 * dt);
    }

    if (state === STATE.PLAYING) {
      // difficulty ramp
      speed = Math.min(4.6, 2.5 + score * 0.03);

      // ceiling: slide along, no death
      if (ant.y < ant.r) { ant.y = ant.r; ant.vy = Math.max(ant.vy, 0); }

      // spawn
      spawnTimer -= speed * dt;
      if (spawnTimer <= 0 || pipes.length === 0) {
        spawnPipe();
        spawnTimer = 235;
      }

      // move + score + collision
      for (var i = pipes.length - 1; i >= 0; i--) {
        var p = pipes[i];
        p.x -= speed * dt;

        if (!p.passed && p.x + PIPE_W < ant.x - ant.r) {
          p.passed = true;
          score++;
          scoreDisplay.textContent = score;
          sfx.score();
        }
        if (p.x + PIPE_W < -10) pipes.splice(i, 1);

        if (
          circleRectHit(ant.x, ant.y, ant.r, p.x, 0, PIPE_W, p.gapY) ||
          circleRectHit(ant.x, ant.y, ant.r, p.x, p.gapY + p.gap, PIPE_W, GROUND_Y - p.gapY - p.gap)
        ) {
          die();
          break;
        }
      }

      if (ant.y + ant.r >= GROUND_Y) {
        ant.y = GROUND_Y - ant.r;
        die();
      }
      groundOffset = (groundOffset + speed * dt) % 40;
    }

    if (state === STATE.DYING) {
      // fall to the ground, then show game over
      if (ant.y + ant.r >= GROUND_Y) {
        ant.y = GROUND_Y - ant.r;
        gameOver();
      }
      shake = Math.max(0, shake - dt);
    }

    // particles
    for (var j = particles.length - 1; j >= 0; j--) {
      var pt = particles[j];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.life -= 0.05 * dt;
      if (pt.life <= 0) particles.splice(j, 1);
    }
  }

  // ===== Draw =====
  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.ellipse(x, y, 34 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 24 * s, y + 6 * s, 22 * s, 12 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 26 * s, y + 5 * s, 24 * s, 13 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPipe(p) {
    // branch-style pipes
    var trunkGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    trunkGrad.addColorStop(0, '#6d8f3a');
    trunkGrad.addColorStop(0.35, '#8fb84e');
    trunkGrad.addColorStop(1, '#55742c');

    function trunk(x, y, w, h) {
      ctx.fillStyle = trunkGrad;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 8);
      ctx.fill();
      ctx.strokeStyle = '#3e5a1e';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    trunk(p.x, -10, PIPE_W, p.gapY + 10);
    trunk(p.x, p.gapY + p.gap, PIPE_W, GROUND_Y - p.gapY - p.gap + 10);

    // cut ends (tree rings)
    ctx.fillStyle = '#c9a86a';
    ctx.beginPath();
    ctx.roundRect(p.x + 6, p.gapY - 16, PIPE_W - 12, 16, 4);
    ctx.fill();
    ctx.beginPath();
    ctx.roundRect(p.x + 6, p.gapY + p.gap, PIPE_W - 12, 16, 4);
    ctx.fill();
    ctx.strokeStyle = '#8a6d3b';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x + 6, p.gapY - 16, PIPE_W - 12, 16);
    ctx.strokeRect(p.x + 6, p.gapY + p.gap, PIPE_W - 12, 16);
  }

  function drawAnt() {
    ctx.save();
    ctx.translate(ant.x, ant.y);
    ctx.rotate(ant.rot);

    // wing (flapping)
    var wingAng = -0.6 - ant.wing * 0.9 + (state === STATE.PLAYING ? Math.sin(frames / 2) * 0.25 : 0);
    ctx.save();
    ctx.translate(-4, -8);
    ctx.rotate(wingAng);
    ctx.fillStyle = 'rgba(200, 230, 255, .8)';
    ctx.beginPath();
    ctx.ellipse(0, -10, 6, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(120,160,200,.9)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // hand-drawn vector ant (consistent across platforms)
    // head
    ctx.fillStyle = '#3a2a1e';
    ctx.beginPath();
    ctx.arc(11, -2, 7, 0, Math.PI * 2);
    ctx.fill();
    // antennae
    ctx.strokeStyle = '#3a2a1e';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(13, -8); ctx.quadraticCurveTo(18, -16, 23, -14);
    ctx.moveTo(11, -9); ctx.quadraticCurveTo(13, -18, 18, -19);
    ctx.stroke();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(13, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(14, -4, 1.2, 0, Math.PI * 2); ctx.fill();
    // thorax
    ctx.fillStyle = '#4a3524';
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 7, 0, 0, Math.PI * 2); ctx.fill();
    // abdomen (striped)
    ctx.fillStyle = '#5c4228';
    ctx.beginPath(); ctx.ellipse(-12, 2, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3a2a1e';
    ctx.lineWidth = 2.5;
    for (var s = -1; s <= 1; s++) {
      ctx.beginPath();
      ctx.moveTo(-12 + s * 5, -6.5);
      ctx.lineTo(-12 + s * 5, 10.5);
      ctx.stroke();
    }
    // legs
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(3, 6);   ctx.lineTo(8, 12);
    ctx.moveTo(-2, 7);  ctx.lineTo(-3, 13);
    ctx.moveTo(-8, 7);  ctx.lineTo(-12, 12);
    ctx.stroke();

    ctx.restore();
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    // sky
    var sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#7ec8e3');
    sky.addColorStop(0.6, '#bde4f4');
    sky.addColorStop(1, '#e8f7d4');
    ctx.fillStyle = sky;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // distant hills
    ctx.fillStyle = 'rgba(130, 170, 120, .45)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.quadraticCurveTo(80, GROUND_Y - 120, 170, GROUND_Y);
    ctx.quadraticCurveTo(260, GROUND_Y - 160, 360, GROUND_Y);
    ctx.lineTo(420, GROUND_Y);
    ctx.closePath();
    ctx.fill();

    // clouds
    for (var c = 0; c < clouds.length; c++) drawCloud(clouds[c].x, clouds[c].y, clouds[c].s);

    // pipes
    for (var i = 0; i < pipes.length; i++) drawPipe(pipes[i]);

    // ground
    ctx.fillStyle = '#8a6d3b';
    ctx.fillRect(-20, GROUND_Y, W + 40, GROUND_H + 20);
    ctx.fillStyle = '#7cb342';
    ctx.fillRect(-20, GROUND_Y, W + 40, 12);
    ctx.fillStyle = '#689f38';
    for (var g = -40; g < W + 40; g += 40) {
      ctx.beginPath();
      ctx.moveTo(g + groundOffset, GROUND_Y + 12);
      ctx.lineTo(g + groundOffset + 20, GROUND_Y + 12);
      ctx.lineTo(g + groundOffset + 10, GROUND_Y + 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = '#755a30';
    for (var d = 0; d < W + 40; d += 26) {
      ctx.fillRect(d + groundOffset * 0.6, GROUND_Y + 30, 14, 4);
    }

    // particles
    for (var p = 0; p < particles.length; p++) {
      var pt = particles[p];
      ctx.fillStyle = 'rgba(255,255,255,' + pt.life * 0.8 + ')';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2);
      ctx.fill();
    }

    drawAnt();
    ctx.restore();
  }

  // ===== Main loop =====
  var last = performance.now();
  function loop(t) {
    // 先排下一帧：即使某帧 update/draw 抛异常，也只是这一帧没画完，
    // 不会让「下一帧永远排不上」→ 游戏永久冻结（实战踩过：一次 TypeError 冻死整局）
    requestAnimationFrame(loop);
    var dt = Math.min((t - last) / 16.666, 2.5); // frame-rate independent
    last = t;
    update(dt);
    draw();
  }
  requestAnimationFrame(loop);

  // reset clock when tab is hidden, prevents jump on return
  document.addEventListener('visibilitychange', function () {
    last = performance.now();
  });
})();
</script>
</body>
</html>
