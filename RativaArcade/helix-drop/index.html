<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #14102b 0%, #2a1f52 55%, #1b2b4d 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    justify-content: safe center;
    min-height: 100vh; min-height: 100svh; padding: 12px 12px 4px; user-select: none;
  }
  .panel {
    position: relative;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.10);

  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }

  #mute-btn {

  }
  /* 画布 560×620：宽度同时受可用高度反推约束。必须两行（svh + vh）。 */
  .wrap {
    width: min(560px, 100%, max(200px, calc((100svh - 272px) * 0.9032)));
    width: min(560px, 100%, max(200px, calc((100vh  - 272px) * 0.9032)));
    margin: 0 auto; border-radius: 12px; overflow: hidden;
    line-height: 0; touch-action: none;
  }
  canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions button {
    flex: 1; min-height: 48px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 800; letter-spacing: 1px; font-family: inherit;
    transition: transform .12s ease;
  }
  .actions button:active { transform: scale(.96); }
  .btn-primary { background: #7a5cf0; color: #fff; box-shadow: 0 4px 0 #4c34a8; }
  .btn-ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .overlay {
    position: absolute; inset: 0; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 18px;
    background: rgba(9, 7, 22, .86); backdrop-filter: blur(3px); color: #fff; z-index: 6;
  }
  .hidden { display: none !important; }
  .over-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  .over-sub { font-size: 13px; opacity: .78; line-height: 1.65; }
  .final-line { font-size: 15px; font-weight: 700; }
  .final-line b { font-size: 22px; }
  .new-record {
    background: #ffd76e; color: #5a3e00; font-size: 12px; font-weight: 800;
    padding: 4px 14px; border-radius: 999px; animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.08) } }
  .over-btns { display: flex; gap: 8px; margin-top: 6px; width: 100%; }
  .over-btns button {
    flex: 1; min-height: 48px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 800; font-family: inherit;
  }
  .icon-big { font-size: 40px; }
  .footer {
    margin-top: 10px; color: rgba(255,255,255,.5); font-size: 12px;
    text-align: center; line-height: 1.9; max-width: 460px;
  }
  .footer a { color: rgba(255,255,255,.78); text-decoration: none; display: inline-block; min-width: 44px; min-height: 44px; line-height: 44px; }
  .footer a:hover { color: #ffd76e; }
  /* 手机横屏(视口高 ≤560px)纵向极紧：把「画布」与「顶栏 + 重开键」并成一排 ——
     一整个 44px 的按钮行是纯纵向浪费，并排后画布能多拿 ~50px。触控目标尺寸不动。
     ★ 这里不能给 .wrap 写 flex-basis:100%（会盖掉 width，画布被拉成整行 810px 宽）。 */
  @media (orientation: landscape) and (max-height: 560px) {
    body { padding: 6px 8px 2px; }
    .panel { padding: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .wrap { order: -1; flex: 0 0 auto; margin: 0;
            width: min(560px, 100%, max(160px, calc((100svh - 160px) * 0.9032))); }
    .wrap { width: min(560px, 100%, max(160px, calc((100vh  - 160px) * 0.9032))); }
    .topbar { flex: 1 1 240px; margin-bottom: 0; min-width: 0; }
    .actions { flex: 0 0 auto; margin-top: 0; }
    .actions button { min-height: 44px; padding: 0 14px; white-space: nowrap; font-size: 13px; }
    .footer { max-width: none; line-height: 1.5; }
    .stat { padding: 1px 6px; }
    .stat small { font-size: 8px; }
    .stat span { font-size: 13px; }
  }
</style>

<script>
(function () {
  'use strict';

  var W = 560, H = 620;
  var CX = W / 2, RX = 138, RY = 44, RING_W = 20;
  var LAYER_GAP = 46;            // 相邻两层在屏幕上的间距
  var BALL_SCREEN_Y = 318;       // 球在屏幕上的固定 y（相机跟随深度）
  var BALL_R = 16;
  var TAU = Math.PI * 2;
  var FRONT = Math.PI / 2;       // 椭圆的「最靠近镜头」参数角
  var START_DEPTH = -3.5;        // 开局球在塔顶上方 3.5 层
  var VMAX = 0.30;               // 终端速度（层/帧）
  var GRAV_D = 0.0040;           // 下落加速度（层/帧²）
  var ROT_PER_PX = 0.018;        // 水平拖动 1px = 转 0.018 弧度（约 349px 一整圈）
  var KEY_STEP = 0.07;
  var STORE_KEY = 'helix_drop_best_v1';

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var startOverlay = document.getElementById('start-overlay');
  var overOverlay = document.getElementById('over-overlay');
  var overTitleEl = document.getElementById('over-title');
  var newRecordEl = document.getElementById('new-record');

  var level = 1, platforms = [], rotation = 0;
  var ballDepth = START_DEPTH, vy = 0, falling = true, alive = true;
  var restIndex = 0, passedCount = 0, scoreBase = 0, score = 0;
  var started = false, cleared = false, endKey = null, endStats = null;
  var best = 0;
  var drag = null, didDrag = 0;
  var shake = 0, flash = 0;
  var trail = [];

  try {
    var raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (raw && typeof raw === 'object') best = raw.best || 0;
    else if (typeof raw === 'number') best = raw;
  } catch (e) { best = 0; }

  // ===== 音效 =====
  var audioCtx = null, muted = false;
  function beep(freq, dur, type, vol) {
    if (muted) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  var sfx = {
    tick:  function (n) { beep(300 + Math.min(9, n) * 55, 0.05, 'triangle', 0.05); },
    land:  function () { beep(150, 0.1, 'sine', 0.06); },
    turn:  function () { beep(430, 0.03, 'square', 0.02); },
    die:   function () { [330, 262, 196].forEach(function (f, i) { setTimeout(function () { beep(f, 0.25, 'sawtooth', 0.08); }, i * 140); }); },
    win:   function () { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { setTimeout(function () { beep(f, 0.2, 'triangle', 0.09); }, i * 95); }); }
  };
  var muteBtn = document.getElementById('mute-btn');
  muteBtn.addEventListener('click', function (e) {
    e.stopPropagation(); muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ===== 塔的生成 =====
  // 第 3 层强制带一段红 —— 开局几层是安全的，第 3 层教会玩家「红段会死」，
  // 同时给探针一个完全确定性的「撞红段」用例（见 gameplay-probe）。
  function makeTower(lv) {
    var n = 24 + lv * 3;
    var list = [], i;
    for (i = 0; i < n; i++) {
      var gapW = Math.max(0.62, 1.42 - (lv - 1) * 0.055);
      var gapA = Math.random() * TAU;
      var danger = null;
      if (i === 3) {
        // 红段必须相对「本层缺口」定位，不能写死绝对角 —— 写死的话它会随机压在缺口上，
        // 那一层就只剩「撞红段」一条路（实测扫 42 层里抓到过）。
        danger = { a: gapA + Math.PI * 0.9, w: Math.min(1.35, 0.75 + (lv - 1) * 0.06) };
      } else if (i > 3) {
        var p = Math.min(0.55, 0.14 + (lv - 1) * 0.04);
        if (Math.random() < p) {
          // 红段和缺口必须错开（否则这一层必然无解）：中心角至少隔 0.62π，
          // 两者半宽之和最大 ~1.39 rad < 1.95 rad。
          var off = Math.PI * (0.62 + Math.random() * 0.72);
          danger = { a: gapA + (Math.random() < 0.5 ? -off : off), w: Math.min(1.35, 0.7 + Math.random() * 0.4 + (lv - 1) * 0.05) };
        }
      }
      list.push({ gapA: gapA, gapW: gapW, danger: danger });
    }
    return list;
  }
  function angDiff(a, b) {
    var d = (a - b) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return Math.abs(d);
  }
  function alignedGap(i) {
    var p = platforms[i];
    if (!p) return true;
    return angDiff(FRONT, p.gapA + rotation) <= p.gapW / 2;
  }
  function onDanger(i) {
    var p = platforms[i];
    if (!p || !p.danger) return false;
    return angDiff(FRONT, p.danger.a + rotation) <= p.danger.w / 2;
  }
  function nextIdx() {
    var n = Math.floor(ballDepth + 1e-9) + 1;
    return n < 0 ? 0 : n;
  }
  function depthNow() { return Math.max(0, Math.floor(ballDepth)); }

  // ===== 流程 =====
  function newLevel(lv, keepScore) {
    level = lv;
    platforms = makeTower(lv);
    rotation = 0;
    ballDepth = START_DEPTH; vy = 0; falling = true; alive = true;
    restIndex = 0; passedCount = 0;
    trail = []; shake = 0; flash = 0;
    cleared = false; endKey = null; endStats = null;
    if (!keepScore) score = 0;
    scoreBase = score;
    overOverlay.classList.add('hidden');
    newRecordEl.classList.add('hidden');
    refreshAll();
  }
  function restartLevel() {
    newLevel(level, false);
    started = true;
    startOverlay.classList.add('hidden');
  }
  function saveBest() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ best: best })); } catch (e) {}
  }
  function die() {
    if (!alive) return;
    alive = false; falling = false;
    endKey = 'helixDrop.over';
    endStats = { score: score, level: level, depth: restIndex };
    shake = 18; flash = 1;
    sfx.die();
    var rec = false;
    if (score > best) { best = score; rec = true; saveBest(); }
    newRecordEl.classList.toggle('hidden', !rec);
    document.getElementById('btn-next').classList.add('hidden');
    document.getElementById('btn-again').classList.remove('hidden');
    refreshAll();
    overOverlay.classList.remove('hidden');
  }
  function winLevel() {
    if (cleared) return;
    cleared = true; falling = false;
    endKey = 'helixDrop.cleared';
    endStats = { score: score, level: level, depth: platforms.length };
    sfx.win();
    var rec = false;
    if (score > best) { best = score; rec = true; saveBest(); }
    newRecordEl.classList.toggle('hidden', !rec);
    document.getElementById('btn-next').classList.remove('hidden');
    document.getElementById('btn-again').classList.add('hidden');
    refreshAll();
    overOverlay.classList.remove('hidden');
  }
  function begin() {
    if (started) return;
    started = true;
    startOverlay.classList.add('hidden');
  }

  // ===== 物理 =====
  function update(dt) {
    var i;
    if (shake > 0) shake = Math.max(0, shake - 0.9 * dt);
    if (flash > 0) flash = Math.max(0, flash - 0.05 * dt);
    for (i = trail.length - 1; i >= 0; i--) {
      trail[i].life -= dt;
      trail[i].y += 0.6 * dt;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }
    if (!alive || cleared) return;
    if (!started) return;

    // 停在被挡住的那一层：只有把缺口转到正前方才能继续掉
    if (!falling) {
      if (alignedGap(restIndex)) { falling = true; vy = 0; }
      return;
    }
    var prev = ballDepth;
    vy = Math.min(VMAX, vy + GRAV_D * dt);
    ballDepth += vy * dt;
    if (vy > 0.12) {
      trail.push({ x: CX, y: BALL_SCREEN_Y + RY, life: 12 });
      if (trail.length > 40) trail.shift();
    }
    var from = Math.floor(prev + 1e-9), to = Math.floor(ballDepth + 1e-9);
    for (i = from + 1; i <= to; i++) {
      if (i < 0) continue;
      if (i >= platforms.length) { ballDepth = platforms.length; passedCount = platforms.length; score = scoreBase + passedCount * 5; winLevel(); return; }
      if (alignedGap(i)) {
        passedCount++;
        score = scoreBase + passedCount * 5;
        sfx.tick(passedCount);
        continue;
      }
      // 撞在实心部分：停住；若正好是红段则结束
      ballDepth = i - 0.02; vy = 0; falling = false; restIndex = i;
      if (onDanger(i)) { die(); return; }
      sfx.land();
      return;
    }
    refreshHud();
  }

  // ===== 渲染 =====
  function shade(rgb, f) {
    var r = Math.round(rgb[0] * f), g = Math.round(rgb[1] * f), b = Math.round(rgb[2] * f);
    return 'rgb(' + Math.min(255, r) + ',' + Math.min(255, g) + ',' + Math.min(255, b) + ')';
  }
  var TOP_RING = [96, 132, 178], SIDE_RING = [38, 52, 74];
  function drawBg() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1440'); g.addColorStop(0.55, '#2b2060'); g.addColorStop(1, '#132039');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.beginPath(); ctx.arc(CX, H * 0.16, 150, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(CX, H * 0.16, 100, 0, TAU); ctx.fill();
  }
  function drawPole() {
    var g = ctx.createLinearGradient(CX - 9, 0, CX + 9, 0);
    g.addColorStop(0, '#20283c'); g.addColorStop(0.45, '#5a6c8e'); g.addColorStop(1, '#1b2233');
    ctx.fillStyle = g;
    ctx.fillRect(CX - 9, 0, 18, H);
    ctx.fillStyle = 'rgba(255,255,255,.06)';
    ctx.fillRect(CX - 9, 0, 4, H);
  }
  function drawRings() {
    var i;
    // 只画视口内可见的层；按屏幕 y 从上到下画，越靠下（离镜头越近）越后画 = 压在上面
    var lo = Math.max(0, Math.floor(ballDepth - (BALL_SCREEN_Y + 80) / LAYER_GAP));
    var hi = Math.min(platforms.length - 1, Math.ceil(ballDepth + (H - BALL_SCREEN_Y + 80) / LAYER_GAP));
    var next = nextIdx();
    for (i = lo; i <= hi; i++) {
      var p = platforms[i];
      var y = BALL_SCREEN_Y + (i - ballDepth) * LAYER_GAP;
      var k = Math.max(-1, Math.min(1, (y - BALL_SCREEN_Y) / 210));
      var f = 0.72 + 0.30 * k;
      var g0 = p.gapA + rotation;
      var a0 = g0 + p.gapW / 2, a1 = g0 - p.gapW / 2 + TAU;

      ctx.lineCap = 'round';
      ctx.lineWidth = RING_W;
      ctx.strokeStyle = shade(SIDE_RING, f);
      ctx.beginPath(); ctx.ellipse(CX, y + 7, RX, RY, 0, a0, a1); ctx.stroke();

      ctx.strokeStyle = shade(TOP_RING, f);
      ctx.beginPath(); ctx.ellipse(CX, y, RX, RY, 0, a0, a1); ctx.stroke();

      if (i === next && (i > 0 || ballDepth > START_DEPTH + 0.4)) {
        ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(CX, y - 2, RX + 5, RY + 3, 0, a0, a1); ctx.stroke();
        ctx.lineWidth = RING_W;
      }
      if (p.danger) {
        var d0 = p.danger.a + rotation - p.danger.w / 2, d1 = p.danger.a + rotation + p.danger.w / 2;
        ctx.strokeStyle = shade([190, 52, 62], f + 0.05);
        ctx.beginPath(); ctx.ellipse(CX, y + 7, RX, RY, 0, d0, d1); ctx.stroke();
        ctx.strokeStyle = shade([235, 74, 72], f + 0.12);
        ctx.beginPath(); ctx.ellipse(CX, y, RX, RY, 0, d0, d1); ctx.stroke();
        ctx.strokeStyle = 'rgba(255,190,180,.75)'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.ellipse(CX, y - 3, RX, RY, 0, d0 + 0.06, d1 - 0.06); ctx.stroke();
        ctx.lineWidth = RING_W;
      }
    }
    ctx.lineCap = 'butt';
  }
  function drawBall() {
    var by = BALL_SCREEN_Y + RY;
    var i;
    for (i = 0; i < trail.length; i++) {
      var t = trail[i];
      ctx.globalAlpha = Math.max(0, t.life / 30);
      ctx.fillStyle = '#ffd76e';
      ctx.beginPath(); ctx.arc(t.x, t.y, BALL_R * 0.45, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    var g = ctx.createRadialGradient(CX - 5, by - 6, 2, CX, by, BALL_R + 2);
    g.addColorStop(0, '#fff6d8'); g.addColorStop(0.45, '#ffd76e'); g.addColorStop(1, '#e0902a');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(CX, by, BALL_R, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgba(120,70,0,.45)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CX, by, BALL_R, 0, TAU); ctx.stroke();
  }
  function drawOverlayFx() {
    if (flash > 0) {
      ctx.fillStyle = 'rgba(232,60,60,' + (flash * 0.5) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }
  function draw() {
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    ctx.clearRect(-30, -30, W + 60, H + 60);
    drawBg(); drawPole(); drawRings(); drawBall();
    ctx.restore();
    drawOverlayFx();
  }

  // ===== 主循环 =====
  var last = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);              // ★ 先排帧
    var dt = Math.min((now - last) / 16.666, 2.5);
    last = now;
    update(dt);
    draw();
  }
  document.addEventListener('visibilitychange', function () { last = performance.now(); });

  // ===== HUD =====
  function refreshBest() {
    document.getElementById('hud-best').textContent = best > 0 ? best : '—';
    document.getElementById('start-best').textContent = best > 0
      ? t('common.bestScore', { n: best })
      : t('helixDrop.first');
    document.getElementById('over-best').textContent = best > 0 ? t('common.bestScore', { n: best }) : '';
  }
  function refreshHud() {
    document.getElementById('hud-level').textContent = level;
    document.getElementById('hud-score').textContent = score;
    document.getElementById('hud-depth').textContent = depthNow();
  }
  function refreshOver() {
    if (!endKey) return;
    overTitleEl.textContent = t(endKey);
    if (endStats) {
      document.getElementById('final-line').innerHTML =
        t('helixDrop.final', { n: endStats.score, m: endStats.depth });
    }
  }
  function refreshAll() { refreshBest(); refreshHud(); refreshOver(); }
  WG.onChange(refreshAll);

  // ===== 输入：指针 / 触摸（水平拖动 = 转塔；touch-action:none 已在 CSS 上） =====
  canvas.addEventListener('pointerdown', function (e) {
    if (!alive || cleared) return;
    e.preventDefault();
    begin();
    drag = { x0: e.clientX, rot0: rotation };
    didDrag = 0;
    if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    e.preventDefault();
    var dx = e.clientX - drag.x0;
    didDrag = Math.max(didDrag, Math.abs(dx));
    rotation = drag.rot0 + dx * ROT_PER_PX;
  });
  function endDrag() { if (drag) { sfx.turn(); drag = null; } }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', function () { drag = null; });
  // click 兜底：只派发 click 的环境（无 pointer 序列）也能小步转塔；真拖动后的合成 click 会被 didDrag 挡掉
  canvas.addEventListener('click', function (e) {
    if (!alive || cleared || didDrag > 6) return;
    begin();
    var r = canvas.getBoundingClientRect();
    rotation += ((e.clientX - r.left) / Math.max(1, r.width) < 0.5) ? -0.12 : 0.12;
  });

  // ===== 输入：键盘 =====
  window.addEventListener('keydown', function (e) {
    var k = String(e.key || '').toLowerCase();
    if (k === 'arrowleft' || k === 'a') { begin(); rotation -= KEY_STEP; e.preventDefault(); return; }
    if (k === 'arrowright' || k === 'd') { begin(); rotation += KEY_STEP; e.preventDefault(); return; }
    if (k === 'r') { restartLevel(); e.preventDefault(); return; }
  });

  document.getElementById('btn-start').addEventListener('click', begin);
  document.getElementById('btn-restart').addEventListener('click', function () { begin(); restartLevel(); });
  document.getElementById('btn-next').addEventListener('click', function () { newLevel(level + 1, true); startOverlay.classList.add('hidden'); });
  document.getElementById('btn-again').addEventListener('click', function () { newLevel(1, false); startOverlay.classList.add('hidden'); });

  function shareText() { return t('helixDrop.share', { n: score, url: location.href }); }
  function fallbackCopy(text, done) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }
  document.getElementById('btn-share2').addEventListener('click', function () {
    var full = shareText(), btn = document.getElementById('btn-share2');
    function done() {
      btn.textContent = t('common.copied');
      setTimeout(function () { btn.textContent = t('common.shareScore'); }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(full).then(done, function () { fallbackCopy(full, done); });
    } else fallbackCopy(full, done);
  });

  newLevel(1, false);
  refreshAll();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
