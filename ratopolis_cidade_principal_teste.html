<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#244b39">
<title>Ratópolis — Cidade Principal (Teste)</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172b24}
iframe{display:block;border:0;width:100%;height:100%;background:#172b24}
</style>
</head>
<body>
<iframe id="ratopolisTest" title="Ratópolis — Cidade Principal" allow="fullscreen; autoplay; gamepad" allowfullscreen src="./ratopolis_v1.55.11_multiplayer_reconnect_fix.html?cityhubtest=1"></iframe>
<script>
(function(){
 const frame=document.getElementById('ratopolisTest');
 const patch=`
 /* Cidade Principal — teste visual usando o lobby e os recursos originais */
 #start .rm-scene{background:linear-gradient(180deg,#9ed4e8 0%,#c6e2d1 48%,#8abf76 72%,#4e8d4d 100%)!important}
 #start .rm-sun{background:radial-gradient(circle,#fff1b2 0 45%,#f4d77c 46% 100%)!important;box-shadow:0 0 42px #fff0a8a8!important}
 #start .rm-hill{background:linear-gradient(180deg,#8fbd78,#4f8b57)!important}
 #start .rm-plat,#start .rm-ch,#start .rm-ac{display:none!important}
 #start .rm-ground{height:24%!important;background:linear-gradient(#70b85b 0 18%,#805638 18% 100%)!important;border-top:2px solid #386f3b!important;box-shadow:0 -3px 0 #5c9b4b!important}
 #start .rm-rat{left:16%!important;bottom:calc(24% + 3.4cqh)!important;animation:none!important;transform:none!important;filter:drop-shadow(0 .8cqh .4cqh #0006)!important}
 #start .rm-leaf{opacity:.72!important}
 #start .rm-main:before{content:"CIDADE PRINCIPAL";position:absolute;z-index:2;left:3%;top:15%;padding:.7cqh 1.5cqh;border:1px solid #ffffff8c;border-radius:999px;background:#244d36d9;color:#fff4c9;font-weight:950;font-size:clamp(10px,2.5cqh,15px);letter-spacing:.12em;box-shadow:0 2px 8px #173c2a55}
 @media(orientation:portrait) and (max-width:900px){#start .rm-shell{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important}}
 `;
 function inject(){
  try{
   const doc=frame.contentDocument;
   if(!doc||!doc.head)return;
   if(doc.getElementById('ratopolis-city-hub-test-style'))return;
   const style=doc.createElement('style');
   style.id='ratopolis-city-hub-test-style';
   style.textContent=patch;
   doc.head.appendChild(style);
   doc.documentElement.setAttribute('data-city-hub-test','v1');
  }catch(e){console.error('Não foi possível aplicar o visual de teste:',e)}
 }
 frame.addEventListener('load',inject);
 setTimeout(inject,800);
})();
</script>
</body>
</html>
